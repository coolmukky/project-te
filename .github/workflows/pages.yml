name: Publish to GitHub Pages

# Manual only, and deliberately so.
#
# This document is a staff pack, not a public page: it names 19 people, and it
# carries 88 Webex meeting passwords and 104 join links, each also encoded in a
# QR code. A Pages site is readable by anyone who has the URL even when the
# repository behind it is private - making the repo private does not make the
# site private, which needs Pages access control on GitHub Enterprise Cloud.
#
# So publishing is a decision a person makes on purpose, never something a push
# does on its own. The job below will not run on a commit, and will not publish
# a document still carrying credentials unless it is told to in as many words.
on:
  workflow_dispatch:
    inputs:
      publish_credentials:
        description: >-
          The document contains Webex meeting passwords and join links, and a
          Pages site is public. Type yes to publish it anyway.
        required: true
        default: "no"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a cancelled deploy can
# leave the site serving a half-written build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the single-file document
        run: python3 build.py -o _site/index.html

      - name: Check the markup is the published document
        # The same digest test_app.py asserts. A document whose markup has been
        # edited is not the one that was reviewed, and should not be the one
        # that goes up.
        run: |
          python3 - <<'PY'
          import hashlib, sys
          import test_app
          got = hashlib.sha256(open("src/index.html", "rb").read()).hexdigest()
          if got != test_app.MARKUP_SHA256:
              sys.exit("markup digest %s does not match the published document %s"
                       % (got, test_app.MARKUP_SHA256))
          print("markup matches the published document")
          PY

      - name: Refuse to publish credentials by accident
        env:
          CONFIRMED: ${{ inputs.publish_credentials }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          secrets=$(grep -o 'Password:' _site/index.html | wc -l)
          echo "repository private: $IS_PRIVATE"
          echo "meeting passwords in the built document: $secrets"
          if [ "$secrets" -gt 0 ] && [ "$CONFIRMED" != "yes" ]; then
            echo "::error::Refusing to publish. The built document carries $secrets meeting"
            echo "::error::passwords, and a Pages site is readable by anyone with the URL"
            echo "::error::whether or not this repository is private. Remove them, or re-run"
            echo "::error::this workflow with publish_credentials set to yes."
            exit 1
          fi
          if [ "$secrets" -gt 0 ]; then
            echo "::warning::Publishing $secrets meeting passwords to a public URL, as instructed."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
