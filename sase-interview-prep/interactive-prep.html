<title>Prisma SASE Interview Runbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a trail map. The map (home) shows the route of quests; each quest page stacks its obstacles as
   encounter → dojo → retest cards; the Interview Hall and the Verdict close the journey. */
:root{
  --bg:#e7edef; --surface:#fbfcfc; --sunk:#dde5e8; --ink:#1a2430; --muted:#566573; --line:#c5d0d6;
  --route:#1d6b74; --route-soft:#d3e7e8; --route-ink:#ffffff; --ember:#a8670f; --ember-soft:#f3e6cf;
  --good:#1e7346; --good-soft:#d9eee1; --warn:#9a5d00; --warn-soft:#f5e8d2; --bad:#ad2b20; --bad-soft:#f6dedb;
  --display:"Alegreya SC",Georgia,"Times New Roman",serif;
  --body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1520; --surface:#16202c; --sunk:#1d2a38; --ink:#e7edf2; --muted:#94a5b5; --line:#2c3b4b;
  --route:#55c2c9; --route-soft:#173a40; --route-ink:#06171a; --ember:#f0b04c; --ember-soft:#3a2c14;
  --good:#55c78d; --good-soft:#143425; --warn:#e9a84a; --warn-soft:#392a13; --bad:#f2796e; --bad-soft:#3e1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1520; --surface:#16202c; --sunk:#1d2a38; --ink:#e7edf2; --muted:#94a5b5; --line:#2c3b4b;
  --route:#55c2c9; --route-soft:#173a40; --route-ink:#06171a; --ember:#f0b04c; --ember-soft:#3a2c14;
  --good:#55c78d; --good-soft:#143425; --warn:#e9a84a; --warn-soft:#392a13; --bad:#f2796e; --bad-soft:#3e1d1a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--route)}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:1.45rem}
h2{font-size:2.2rem}
h3{font-size:1.45rem}
h4{font-size:1.12rem}
.label{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.note{font-size:.9rem;color:var(--muted)}
.err{color:var(--bad);font-size:.92rem}
.v{font-family:var(--mono);font-size:.66rem;padding:0 5px;border-radius:3px;background:var(--warn-soft);color:var(--warn);white-space:nowrap;vertical-align:middle}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand a{color:var(--ink);text-decoration:none}
.brand small{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.stats{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap;align-items:flex-end}
.stat{display:flex;flex-direction:column;gap:2px;min-width:96px}
.stat b{font-family:var(--mono);font-weight:500;font-size:.95rem}
.stat .bar{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--ember);width:0;transition:width .5s}
.sync{font-family:var(--mono);font-size:.64rem;color:var(--muted)}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 72px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lead{font-size:1.1rem;max-width:66ch}

button{font:inherit;font-size:.95rem;font-weight:700;padding:9px 18px;border-radius:7px;border:1px solid var(--route);background:var(--route);color:var(--route-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--route)}
button.ember{background:var(--ember);border-color:var(--ember);color:var(--surface)}
button:disabled{opacity:.5;cursor:default}

/* hero banner */
.herobar{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .title{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--ember)}
.meters{display:flex;flex-direction:column;gap:8px}
.m{display:grid;grid-template-columns:minmax(110px,140px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.92rem}
.m .bar{height:9px;background:var(--sunk);border-radius:5px;overflow:hidden}
.m .bar i{display:block;height:100%;background:var(--route);border-radius:5px}
.m b{font-family:var(--mono);font-weight:500;text-align:right}

/* map */
.mapbox{overflow-x:auto}
.map{display:block;width:100%;min-width:640px;height:auto}
.map .seg{fill:none;stroke:var(--line);stroke-width:5;stroke-dasharray:2 11;stroke-linecap:round}
.map .seg.done{stroke:var(--route);stroke-dasharray:none}
.map .node circle{fill:var(--surface);stroke:var(--line);stroke-width:3;transition:transform .2s}
.map .node.started circle{stroke:var(--ember)}
.map .node.cleared circle{fill:var(--route);stroke:var(--route)}
.map .node.final circle{stroke:var(--ember);stroke-width:4}
.map .node.final.cleared circle{fill:var(--ember);stroke:var(--ember)}
.map .node text.num{font-family:var(--display);font-size:22px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.map .node.cleared text.num{fill:var(--route-ink)}
.map .node text.nm{font-family:var(--body);font-size:15px;font-weight:700;fill:var(--ink);text-anchor:middle}
.map .node text.sub{font-family:var(--mono);font-size:11px;fill:var(--muted);text-anchor:middle}
.map .node:hover circle,.map .node:focus circle{stroke:var(--ember)}
.map .flag path{fill:var(--ember)}
.map .flag line{stroke:var(--ink);stroke-width:2}
.map .flag text{font-family:var(--mono);font-size:11px;fill:var(--ember);text-anchor:middle;font-weight:500}
@media (prefers-reduced-motion:no-preference){.map .flag{animation:bob 2.4s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-4px)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:inline-block}
.sw.started{border-color:var(--ember)}
.sw.cleared{background:var(--route);border-color:var(--route)}

.satchel{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scroll{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink)}
.scroll:hover{border-color:var(--route)}
.scroll .row{justify-content:space-between}

/* quest page */
.questhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:30px;height:8px;border-radius:4px;background:var(--sunk)}
.pip.started{background:var(--ember)}
.pip.cleared{background:var(--route)}
.topic{font-family:var(--mono);font-size:.78rem;color:var(--route)}

.obs{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.obs.active{border-color:var(--ember)}
.obshead{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 18px;background:transparent;color:var(--ink);border:0;border-radius:0;text-align:left;font-weight:400}
.obshead:hover{background:var(--sunk)}
.badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem;border:2px solid var(--line)}
.badge.started{border-color:var(--ember);color:var(--ember)}
.badge.cleared{background:var(--route);border-color:var(--route);color:var(--route-ink)}
.obshead .t{min-width:0}
.obshead .t b{font-family:var(--display);font-size:1.15rem;display:block}
.obshead .t span{font-size:.85rem;color:var(--muted)}
.pill{font-family:var(--mono);font-size:.72rem;padding:3px 9px;border-radius:4px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--sunk);color:var(--muted)}
.obsbody{padding:4px 18px 20px;display:flex;flex-direction:column;gap:16px}

.stages{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content;max-width:100%}
.stages span{font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;color:var(--muted);border-right:1px solid var(--line)}
.stages span:last-child{border-right:0}
.stages span.on{background:var(--ember-soft);color:var(--ember);font-weight:500}
.stages span.done{color:var(--route)}

.scene{font-style:italic;color:var(--muted);max-width:68ch;border-left:3px solid var(--ember);padding-left:12px}
.challenger{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start;background:var(--sunk);border-radius:10px;padding:14px 16px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--surface);border:2px solid var(--route);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--route);font-size:1.1rem}
.challenger .who{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.challenger q{display:block;font-size:1.12rem;font-weight:700;quotes:none;margin-top:2px}

textarea{width:100%;min-height:160px;font:inherit;font-size:1rem;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);resize:vertical}
.result{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.result .scoreline{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.result .big{font-family:var(--display);font-size:2.4rem;line-height:1}
.cats{display:flex;flex-direction:column;gap:5px}
.cat{display:grid;grid-template-columns:minmax(120px,160px) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:.88rem}
.cat .bar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--route)}
.cat b{font-family:var(--mono);font-weight:500;font-size:.8rem}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.twocol ul,.result ul{margin:.2rem 0 0;padding-left:1.1rem}
.better{background:var(--sunk);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:.98rem}
details summary{cursor:pointer}

/* dojo */
.dojo{border:1px solid var(--route);border-radius:12px;background:var(--route-soft);padding:18px;display:flex;flex-direction:column;gap:14px}
.dojo h3{color:var(--route)}
.dojo .card{background:var(--surface);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dojo ul{margin:0;padding-left:1.15rem}
.dojo li{margin:.2rem 0}
.dojo .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.say{border-left:4px solid var(--ember);background:var(--ember-soft);border-radius:0 9px 9px 0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.say p{margin:0;font-size:1.02rem}
.say p::before{content:"“";font-family:var(--display);color:var(--ember);font-size:1.4rem;line-height:0;margin-right:2px}
.say p::after{content:"”";font-family:var(--display);color:var(--ember);font-size:1.4rem;line-height:0;margin-left:2px}
.traps li::marker{color:var(--bad)}
.res{display:flex;flex-direction:column;gap:4px;margin:0;padding-left:1.1rem}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:3px}
.checks{display:flex;flex-direction:column;gap:4px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:5px 8px;border-radius:6px;cursor:pointer}
.chk:hover{background:var(--sunk)}
.chk input{margin-top:5px;accent-color:var(--route)}

.questscroll{border:2px solid var(--ember);border-radius:12px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px}

/* hall */
.turn{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.ans{background:var(--sunk);border-radius:9px;padding:10px 13px;white-space:pre-wrap;font-size:.98rem}

.verdict .bigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.verdict .tile{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.verdict .tile b{font-family:var(--display);font-size:2rem;line-height:1.1}

@media (max-width:820px){
  .top{position:static}
  .stats{margin-left:0;width:100%;gap:14px}
  .herobar,.questhead{grid-template-columns:minmax(0,1fr)}
  h2{font-size:1.8rem}
  .panel{padding:16px}
  .obsbody{padding:4px 14px 16px}
  .obshead{padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1><a href="#map">The Prisma SASE Quest</a></h1>
      <small>Palo Alto Networks · Technical Enablement Architect, NetSec &amp; SASE · JR-017228</small></div>

</header>

<script>
(() => {
"use strict";

/* ================================================================ content */
const V = '<span class="v">verify</span>';
const BG = "Candidate background: Technical Enablement Architect at Cisco Systems supporting security enablement (global SE readiness, a Zero Trust Architecture Design Clinic prototype, collaboration with Product, GTM, SMEs and learning design). Previously at Juniper Networks in customer-facing Systems Engineering, technical enablement and technical instruction. Technical: enterprise routing and switching, Juniper SRX, Cisco Firepower / Secure Firewall, Cisco ISE, Zero Trust and identity-based segmentation, Cisco and Juniper SD-WAN, Juniper EX and Mist, EVPN/VXLAN, Apstra, Python, Ansible, lab environments. MS in Information Systems Technology and an MBA. Limited hands-on Prisma SASE experience.";
const DOCS = {
  sase:["Prisma SASE overview","https://www.paloaltonetworks.com/sase"],
  pa:["Prisma Access TechDocs","https://docs.paloaltonetworks.com/prisma-access"],
  scm:["Strata Cloud Manager TechDocs","https://docs.paloaltonetworks.com/strata-cloud-manager"],
  panos:["PAN-OS TechDocs (App-ID, User-ID, Security Profiles, Decryption, Policy Optimizer)","https://docs.paloaltonetworks.com/pan-os"],
  bp:["Palo Alto Best Practices","https://docs.paloaltonetworks.com/best-practices"],
  gp:["GlobalProtect TechDocs (portal, gateways, HIP)","https://docs.paloaltonetworks.com/globalprotect"],
  cie:["Cloud Identity Engine TechDocs","https://docs.paloaltonetworks.com/cloud-identity"],
  ztna:["ZTNA 2.0 overview","https://www.paloaltonetworks.com/sase/ztna"],
  sdwan:["Prisma SD-WAN TechDocs","https://docs.paloaltonetworks.com/prisma-sd-wan"],
  adem:["Autonomous DEM TechDocs","https://docs.paloaltonetworks.com/autonomous-dem"],
  saas:["SaaS Security TechDocs","https://docs.paloaltonetworks.com/saas-security"],
  dlp:["Enterprise DLP TechDocs","https://docs.paloaltonetworks.com/enterprise-dlp"],
  beacon:["Beacon learning platform","https://beacon.paloaltonetworks.com"],
  cert:["Palo Alto certifications","https://www.paloaltonetworks.com/services/education/certification"],
  jd:["The job description","https://jobs.paloaltonetworks.com/en/job/santa-clara/technical-enablement-architect-network-security-and-sase/47263/96174876336"],
  repo:["Your written study pack (GitHub branch)","https://github.com/coolmukky/project-te/tree/claude/zealous-cannon-6vv5py/sase-interview-prep"]
};

const QUESTS = [
{ id:"q1", name:"Gate of Definitions", topic:"SASE, SSE and the Prisma SASE portfolio", weight:3, day:"Sat",
  intro:"The road starts at a gate guarded by people who have heard every slogan. You get through by saying what Prisma SASE is in plain engineering terms.",
  docs:["sase","pa","scm"],
  obstacles:[
  { id:"o11", title:"The Cisco-trained traveller", who:"Hiring Manager", ini:"HM",
    scene:"A new SE who spent five years at Cisco joins your first workshop and asks the question everyone asks in week one.",
    q:"Explain Prisma SASE to a Cisco-trained SE in about 90 seconds. What is architecturally different about it?",
    keys:["Defines SSE vs. SASE correctly","Names Prisma Access, Prisma SD-WAN, Strata Cloud Manager, Cloud Identity Engine, Strata Logging Service, ADEM","States that Prisma Access processing nodes run PAN-OS, so App-ID and Content-ID apply to all ports and protocols","Describes the onboarding paths: mobile users, remote networks, service connections or ZTNA Connector","Gives an honest tradeoff","Maps at least one piece to its Cisco equivalent"],
    dojo:{
      def:"<b>SSE</b> is cloud-delivered security for users and traffic: SWG, CASB and ZTNA, usually with FWaaS and DLP. <b>SASE</b> is SSE plus the WAN edge (SD-WAN), converged under one policy, management and telemetry model. <b>Prisma SASE</b> = Prisma Access (the SSE) + Prisma SD-WAN (ION devices), managed in Strata Cloud Manager, with ADEM for experience, Cloud Identity Engine for identity and Strata Logging Service for logs.",
      how:["Prisma Access security processing nodes (SPNs) are PAN-OS firewalls running in public cloud regions.","Users connect as Mobile Users (GlobalProtect, Prisma Access Agent "+V+", explicit proxy, Prisma Access Browser).","Branches connect as Remote Networks over IPsec. Data centers connect through Service Connections (IPsec + BGP) or ZTNA Connectors.","One security policy model: App-ID, User-ID, Content-ID, URL, DNS Security, DLP, decryption."],
      why:["Policy parity from the data center firewall to the cloud, so customers and SEs reuse what they know.","Full L3–L7 inspection on every port and protocol, not just HTTP/S. That's Palo Alto's main argument against proxy-centric SSE.","Converged operations: one place to configure, one log store, one identity source."],
      ex:"A retailer replaces MPLS backhaul: stores run ION devices that auto-tunnel to Prisma Access remote networks, remote staff use GlobalProtect, and both data centers attach through two service connections. One rulebase in SCM covers all of it.",
      say:["SSE is a security architecture decision. SASE is also a network architecture decision, and the hard part is operational convergence: one policy model, one identity source, one telemetry plane.","Because Prisma Access runs PAN-OS, App-ID and Threat Prevention apply to every port and protocol, so a firewall engineer's skills carry straight into SASE."],
      traps:["Reciting PoP counts or analyst rankings instead of architecture.","Calling every Cisco product an exact equivalent. Say functional peer where the architecture differs.","Skipping the tradeoff. Mention lock-in or firewall-style operations."]
    }},
  { id:"o12", title:"SSE or SASE at the crossroads", who:"Regional SE Leader", ini:"SE",
    scene:"At the crossroads stands an SE with a live deal. The customer deployed another vendor's SD-WAN last year and is struggling with remote users and SaaS security.",
    q:"Does this customer need SASE or just SSE? How would you qualify it, and what would you propose first?",
    keys:["Says it depends on whether the WAN is part of the problem","Notes Prisma Access accepts IPsec from third-party CPE as remote networks","Qualifies on WAN refresh timing, MPLS contracts and ops team structure","Explains the value of integrated troubleshooting in single-vendor SASE (for example ADEM across SD-WAN and SSE)","States the single-vendor vs. best-of-breed tradeoff","Proposes land with SSE, expand to SD-WAN at refresh"],
    dojo:{
      def:"<b>Single-vendor SASE</b> means one vendor supplies both the SD-WAN and the SSE, ideally with one management plane and data store. <b>Dual-vendor SASE</b> combines best-of-breed SD-WAN with a separate SSE, joined by IPsec tunnels and shared identity.",
      how:["Prisma Access remote networks accept standard IPsec (static or BGP) from any vendor's CPE.","Prisma SD-WAN IONs have native integration that auto-provisions those tunnels.","ADEM can measure user and site experience across both SD-WAN and Prisma Access segments when both are Palo Alto."],
      why:["Lead with the problem the customer has. Rip-and-replace pitches lose trust.","SSE-first wins the security deal now and leaves SD-WAN for the refresh cycle.","Single-vendor gains are mostly operational, so the ops team structure matters to the decision."],
      ex:"Propose Prisma Access for mobile users and SaaS security now, onboard the existing SD-WAN sites as remote networks over IPsec, and map the SD-WAN contract end date for a Prisma SD-WAN conversation in 12–18 months.",
      say:["If the WAN isn't the pain, I'd land SSE and keep their SD-WAN. Prisma Access takes IPsec from any CPE.","The single-vendor argument is operational: one policy, one identity source and troubleshooting that spans the WAN and the security cloud."],
      traps:["Pushing Prisma SD-WAN before the customer's WAN is up for refresh.","Treating SASE as a product rather than an architecture."]
    }}
  ]},
{ id:"q2", name:"Cloud Citadel", topic:"Prisma Access building blocks", weight:3, day:"Sat",
  intro:"Inside the citadel the walls have names: mobile users, remote networks, service connections, connectors. Confuse them and the guards send you back.",
  docs:["pa","cie","gp","repo"],
  obstacles:[
  { id:"o21", title:"The four gates", who:"Principal SASE Architect", ini:"PA",
    scene:"The architect draws three arrows into a cloud and hands you the marker.",
    q:"What is the difference between a remote network and a service connection, and where do mobile users fit?",
    keys:["Remote network onboards a site's users so their traffic is secured and can egress to the internet","Service connection onboards resources: IPsec + BGP to a DC, giving routes to private apps and a return path","Service connection is not general internet egress (Traffic Steering is the exception)","Mobile users connect with GlobalProtect / agent / explicit proxy and get IPs from mobile user pools","The same PAN-OS policy applies to all of them","Mentions that the DC must route mobile user pools back via the SC"],
    dojo:{
      def:"<b>Remote Network (RN)</b>: an IPsec tunnel from a branch to a Prisma Access location, so the branch's users are secured. <b>Service Connection (SC)</b>: an IPsec + BGP connection to a data center, HQ or cloud VPC that gives Prisma Access routes to private apps and gives those apps a return path. <b>Mobile Users (MU)</b>: remote endpoints connecting through GlobalProtect (portal and gateways hosted by Prisma Access), the Prisma Access Agent "+V+", explicit proxy, or Prisma Access Browser.",
      how:["RN: static or BGP routing; Prisma Access learns branch subnets. Internet traffic egresses at the location.","SC: BGP. Prisma Access advertises MU pools and RN subnets to the DC, and the DC advertises app prefixes.","MU: clients get addresses from per-region mobile user IP pools (non-overlapping RFC 1918).","Traffic Steering can forward chosen internet traffic out through an SC or dedicated egress "+V+"."],
      why:["Mixing up RN and SC is the fastest way to lose credibility with a Palo Alto architect.","Return routing at the SC is the most common real-world failure in private app access."],
      ex:"Branch users in Denver (RN) reach a payroll app in the Dallas DC: RN → Prisma Access backbone → SC → Dallas. Remote users (MU) take the same SC path.",
      say:["Both are IPsec. A remote network onboards a site's users; a service connection onboards resources and is the transit to private apps, not an internet exit.","The first thing I check with service connections is that the DC routes the mobile user pools back through the SC."],
      traps:["Saying service connections are for internet egress.","Forgetting the return path."]
    }},
  { id:"o22", title:"The acquired kingdom", who:"Principal SASE Architect", ini:"PA",
    scene:"A messenger arrives: the company bought a subsidiary whose network overlaps 10.0.0.0/8, and remote users need apps in both companies by next quarter.",
    q:"The company has two DCs plus an acquired subsidiary that overlaps 10.0.0.0/8. Design private app access and defend service connections vs. ZTNA Connector.",
    keys:["Service connections (IPsec + BGP) with HA for the two core DCs","ZTNA Connectors for the subsidiary because of overlapping IPs and no routing integration","Mentions return routing of mobile user pools to the SCs","Mentions internal DNS for both domains","Names a connector limitation such as server-initiated flows or source NAT","Phases the rollout"],
    dojo:{
      def:"<b>ZTNA Connector</b> is a lightweight VM, deployed in connector groups near the apps, that builds <b>outbound</b> tunnels to Prisma Access. Access is granted to app targets defined by FQDN, wildcard or IP subnet, with no route exchange.",
      how:["No inbound firewall openings and no BGP with the DC.","Overlapping IP space is tolerated; the connector NATs traffic to the app "+V+".","Server-initiated connections toward users (SCCM push, VoIP callbacks) aren't the connector's job "+V+".","Connector groups give HA and scale."],
      why:["M&A, cloud VPCs and app enclaves need access without routing integration.","Core DCs with branch transit, server-initiated flows or dynamic routing still need SCs."],
      ex:"Two SCs to the core DCs with eBGP and AS-path prepend to prefer the primary; a connector group in the subsidiary's DC publishing app targets like *.subco.local; internal DNS entries for corp.local and subco.local.",
      say:["Usually it's both: service connections for the core DC, connectors for clouds, acquisitions and app enclaves.","I still need a service connection when servers initiate connections to users or when branches need DC transit through Prisma Access."],
      traps:["Choosing connectors for everything and breaking server-initiated flows.","Forgetting DNS for the acquired domain."]
    }},
  { id:"o23", title:"The hidden regions", who:"Product Manager, Prisma Access", ini:"PM",
    scene:"A product manager tests whether you know what happens under the console.",
    q:"Explain Prisma Access locations vs. compute locations, and the infrastructure subnet. Why should a customer care?",
    keys:["A location is where users and sites connect and where egress identity is localized","A compute location is the cloud region where processing runs; several locations map to one","Effects on latency, egress IP geography and SaaS IP allow-listing","RN bandwidth is allocated per compute location (verify licensing)","Infrastructure subnet: RFC 1918, non-overlapping, used for internal Prisma Access routing","Mobile user pools must also not overlap"],
    dojo:{
      def:"A <b>Prisma Access location</b> is where users and sites connect. A <b>compute location</b> is the cloud region where the processing nodes actually run, and several locations can map to one. The <b>infrastructure subnet</b> is an RFC 1918 block you supply for Prisma Access internal routing.",
      how:["The user connects to the nearest location; processing happens in its compute location.","Egress IPs are localized per location, so SaaS sees the right country.","Remote network bandwidth is allocated per compute location "+V+".","The infrastructure subnet and MU pools must not overlap anything in the customer network."],
      why:["Hidden latency between location and compute region explains some 'slow' complaints.","SaaS IP allow-listing needs the published egress IPs.","Overlaps break routing in ways that are painful to unwind later."],
      ex:"A user in Lisbon connects to a Portugal location that is served by a compute region elsewhere in Europe; the SaaS app still sees a Portuguese egress IP.",
      say:["I design capacity and latency around compute locations, not just the location list.","Infrastructure subnet and mobile user pools get chosen in the first workshop, because changing them later is disruptive."],
      traps:["Quoting an exact location count. It changes; say 'over 100' "+V+".","Assuming egress happens where the user is."]
    }}
  ]},
{ id:"q3", name:"Firewall Forge", topic:"PAN-OS core: App-ID, User-ID, Content-ID", weight:3, day:"Sat",
  intro:"The forge is where Palo Alto's reputation was made. The smiths only respect engineers who explain mechanisms, not features.",
  docs:["panos","bp","beacon"],
  obstacles:[
  { id:"o31", title:"The masked application", who:"Principal SASE Architect", ini:"PA",
    scene:"Traffic arrives on port 443, but it isn't web browsing.",
    q:"How does App-ID identify an application, including when the traffic is encrypted?",
    keys:["Classification pipeline: IP/port, signatures, decryption if policy allows, protocol decoders, heuristics","Identification continues; the app can shift mid-session and policy is re-evaluated","Before decryption, App-ID sees handshake data such as SNI and certificates","Decryption policy is needed for the inner app and Content-ID","application-default restricts apps to standard ports","Application override skips L7 inspection; prefer custom App-IDs"],
    dojo:{
      def:"<b>App-ID</b> is PAN-OS traffic classification. Every session gets an application identity, and the application is the main key in security policy.",
      how:["Port gives the starting point, then application <b>signatures</b> identify the app.","If a decryption rule matches, TLS is <b>decrypted</b> and inspected inside.","<b>Protocol decoders</b> find apps tunneled inside other protocols; <b>heuristics</b> catch evasive apps.","App shift: <code>ssl</code> → <code>web-browsing</code> → <code>facebook-base</code>; policy is re-checked each time.","Special values: <code>incomplete</code>, <code>insufficient-data</code>, <code>unknown-tcp</code>."],
      why:["Ports no longer identify applications; everything rides 443.","Without decryption, you see the handshake, not the behavior, and threats inside stay hidden."],
      ex:"A rule allows <code>ms-rdp</code> only for IT-Admins with <code>application-default</code>; RDP on port 8443 by anyone else is identified and blocked.",
      say:["Before decryption App-ID still uses SNI and certificate data. To see the real app and run threat inspection, you need a decryption policy with sensible exclusions.","I'd never use application override where a custom App-ID will do, because override switches off L7 inspection."],
      traps:["Describing App-ID as a port list.","Ignoring TLS 1.3 / ECH limits on what's visible without decryption."]
    }},
  { id:"o32", title:"The SRX migration", who:"Regional SE Leader", ini:"SE",
    scene:"A customer moving from SRX shows you their favourite rule and asks you to make it 'Palo Alto style'.",
    q:"The customer has 'any → DC servers, tcp/443, permit'. Rewrite it into best-practice PAN-OS policy and explain how you'd migrate safely.",
    keys:["Splits into App-ID based rules per application with User-ID groups as sources","Uses application-default instead of a port","Attaches a security profile group to every allow rule","Uses Policy Optimizer or logs to discover the apps actually in use","Places new rules above the port rule, watches hit counts, then disables the old rule","Mentions the NAT rule: security policy uses pre-NAT IP and post-NAT zone","Mentions SSL Inbound Inspection for the company's own servers"],
    dojo:{
      def:"<b>Policy Optimizer</b> shows which applications were seen on port-based rules and helps you create App-ID rules from them. <b>Security profile groups</b> bundle Antivirus, Anti-Spyware (with DNS Security), Vulnerability Protection, URL Filtering, File Blocking, WildFire and Data Filtering.",
      how:["Create App-ID rules (for example <code>finance-app</code>, <code>web-browsing</code>) with user groups above the old port rule.","Use <code>application-default</code>, attach the default profile group, and log at session end.","Watch hit counts on the old rule fall to zero, then disable it.","Remember the NAT gotcha: security rules match the <b>pre-NAT IP</b> and the <b>post-NAT zone</b>.","For inbound TLS to your own servers, use <b>SSL Inbound Inspection</b> with the server's certificate and key."],
      why:["Port-based rules leave the door open to any app on that port.","A safe migration path is what convinces cautious firewall teams."],
      ex:"Three rules replace one: Finance group → <code>finance-app</code>; Employees → <code>web-browsing, ssl</code> to the portal; IT-Admins → <code>ssh</code> with MFA. All carry the <code>strict</code> profile group; the old rule is disabled after two weeks at zero hits.",
      say:["I migrate with Policy Optimizer: App-ID rules above the port rule, watch hit counts, then retire the old rule.","Every allow rule carries a profile group. The risk lives in what we allow."],
      traps:["Big-bang rewrites with no observation period.","Forgetting that SRX engineers expect post-NAT addresses in policy."]
    }},
  { id:"o33", title:"The identity oracle", who:"Principal SASE Architect", ini:"PA",
    scene:"The customer runs Cisco ISE on campus, and you know ISE better than anyone in the room.",
    q:"How does User-ID work, and how would you integrate a customer's Cisco ISE with Palo Alto firewalls and Prisma Access?",
    keys:["Explains IP-to-user mapping and group mapping as separate functions","Lists mapping sources: AD event logs, GlobalProtect, Authentication Portal, Terminal Server agent, syslog, XML API","Group mapping from LDAP or Cloud Identity Engine","ISE stays the NAC and authentication authority; User-ID consumes identity via syslog or pxGrid-based integration (verify)","Explains what breaks User-ID (stale mappings, NAT, missing redistribution, branch users without a source)","Mentions Dynamic User Groups for automation"],
    dojo:{
      def:"<b>User-ID</b> maps IP addresses to users and users to groups so policy, logs and reports use identities. It consumes identity from many sources; it isn't a NAC.",
      how:["Mapping sources: AD security event logs (Windows agent or agentless), GlobalProtect, Authentication Portal, Terminal Server agent, syslog (for example Cisco ISE, ClearPass), XML API, XFF.","Group mapping: LDAP or Cloud Identity Engine.","User-ID redistribution shares mappings across firewalls.","Dynamic User Groups let automation tag a user (for example, quarantine) without a commit.","ISE integration: syslog parsing of ISE authentication events or pxGrid-based integrations "+V+"."],
      why:["Identity-based policy is the heart of Zero Trust, and your ISE background is a credibility asset here.","Branch users behind remote networks have no agent, so you must plan their mapping source."],
      ex:"ISE authenticates a campus user with 802.1X and sends the session to the firewall; the rule <code>Finance-Users → sap</code> applies, and the same group comes from CIE when the user works remotely through GlobalProtect.",
      say:["ISE remains the authority for campus access; User-ID consumes that identity for enforcement. Remote users get identity from GlobalProtect and CIE.","Most User-ID failures are stale mappings, NAT hiding the source, or mappings that never reach the enforcement point."],
      traps:["Calling Palo Alto a NAC replacement for ISE.","Forgetting branch users in a SASE design."]
    }}
  ]},
{ id:"q4", name:"Bridge of Trust", topic:"ZTNA 2.0, GlobalProtect and HIP", weight:2, day:"Sat",
  intro:"The bridge only lets you cross if you can tell the difference between a slogan and a configuration.",
  docs:["ztna","gp","pa"],
  obstacles:[
  { id:"o41", title:"The slogan test", who:"Hiring Manager", ini:"HM",
    scene:"The bridge keeper smiles: 'Everyone has a ZTNA slide. Show me what's real.'",
    q:"What is technically different about ZTNA 2.0, or is it marketing? Point to configuration, and tell me what you'd warn SEs not to overclaim.",
    keys:["App-ID based rules instead of IP/port grants","HIP posture re-evaluated during the session, not only at connect","Content-ID and DLP applied to private app traffic","An example of what ZTNA 1.0 misses (an authorized but compromised user exploiting the app)","Balanced view: competitors have closed some gaps; inline L7 inspection on all ports is the durable difference","Links to enablement: teach SEs to show the configuration, not the slogan"],
    dojo:{
      def:"Palo Alto's five <b>ZTNA 2.0</b> principles: least-privileged access, continuous trust verification, continuous security inspection, protect all data, secure all apps. The critique of ZTNA 1.0 is 'allow and ignore': grant an IP:port tunnel, then stop looking.",
      how:["Least privilege → security rules matching App-ID and user group, not subnets.","Continuous trust → HIP posture re-checked during the session; access removed if EDR stops or posture changes.","Continuous inspection → profile groups on the allow rules for private app traffic.","Protect all data → Enterprise DLP across private apps, SaaS and web.","Secure all apps → SCs, connectors and Prisma Access Browser together."],
      why:["Interviewers want engineers who can turn positioning into configuration.","Overclaiming damages field credibility, which is exactly what this role protects."],
      ex:"Contractors get <code>jira</code> and <code>confluence</code> only; access drops when the HIP check sees EDR stopped; a vulnerability profile blocks an exploit attempt against Jira from an authorized session.",
      say:["I'd show three things in configuration: App-ID rules, HIP re-evaluation, and threat profiles on private app traffic.","Some competitors now re-check posture too. The durable difference is inline L7 inspection on every port and protocol."],
      traps:["Repeating the five principles with no configuration behind them.","Claiming competitors can't do any of it."]
    }},
  { id:"o42", title:"The unmanaged contractor", who:"Principal SASE Architect", ini:"PA",
    scene:"Two groups wait at the bridge: contractors on personal laptops, and finance staff on corporate devices.",
    q:"Contractors on unmanaged laptops need two internal web apps; employees need posture-checked access to finance apps. Design it.",
    keys:["Prisma Access Browser (enterprise browser) for unmanaged contractor devices with data controls","GlobalProtect/agent always-on for employees with SAML via CIE","HIP objects/profiles (EDR running, disk encryption, OS version) as match criteria on finance rules","Posture re-evaluated during the session; HIP notifications tell users what to fix","App-ID rules per group to the apps via SC or connector","DLP or copy/download controls for sensitive data"],
    dojo:{
      def:"<b>HIP (Host Information Profile)</b> is the posture report GlobalProtect sends: OS and patch level, disk encryption, EDR status and more. <b>HIP objects</b> define checks; <b>HIP profiles</b> combine them and are used as match criteria in security rules. <b>Prisma Access Browser</b> (from the Talon acquisition) extends policy to unmanaged devices.",
      how:["GlobalProtect portal authenticates and gives config and gateways; gateways terminate the tunnel.","Always-on with pre-logon for managed devices; SAML to the IdP through CIE.","Finance rules require HIP profile <code>corp-managed-secure</code>; HIP notification messages explain a denial.","Contractors use Prisma Access Browser with copy, download, print and screenshot controls."],
      why:["Posture-aware access is the practical meaning of continuous trust.","An enterprise browser avoids VDI cost for web apps, but can't cover thick clients."],
      ex:"Finance user's EDR crashes; the next HIP check fails the profile and the finance app session is blocked, with a message telling them to restart the agent.",
      say:["Managed devices get the agent and HIP; unmanaged ones get the enterprise browser. Same policy engine behind both.","The browser is great for web apps, but thick-client apps still need the agent or VDI."],
      traps:["Giving unmanaged devices full-tunnel network access.","Checking posture only at login."]
    }}
  ]},
{ id:"q5", name:"Labyrinth of Packets", topic:"Traffic flows, DNS, routing and troubleshooting", weight:3, day:"Sat",
  intro:"The labyrinth is where most candidates get lost. Walk it hop by hop, and always ask what the return path looks like.",
  docs:["pa","scm","repo"],
  obstacles:[
  { id:"o51", title:"The packet walk", who:"Principal SASE Architect", ini:"PA",
    scene:"The architect points at a whiteboard: 'Laptop on the left, Jira in the DC on the right. Fill in the middle.'",
    q:"Trace a mobile user reaching jira.corp.local through a service connection, hop by hop, including DNS and the return path. Name three places it can fail.",
    keys:["GlobalProtect/agent tunnel to the MU-SPN with an address from the MU pool","DNS for corp.local resolved via Prisma Access internal DNS settings to DC DNS servers","Policy lookup at the SPN: user, App-ID, HIP, profiles","Backbone to the SC; IPsec and a BGP route for the app prefix","Return path: the DC routes the MU pool back to the SC","Names evidence: traffic logs, SC tunnel/BGP status, DC firewall logs, client routing table"],
    dojo:{
      def:"A <b>packet walk</b> lists every hop, decision and dependency on the way to the app and back. In Prisma Access the hidden dependencies are <b>internal DNS</b> and <b>return routing</b>.",
      how:["Laptop → tunnel → MU-SPN (IP from MU pool).","DNS: Prisma Access proxies internal domains you configured to internal DNS servers reached via the SC.","SPN policy: user group, App-ID, HIP profile, profiles, decryption decision.","Prisma Access backbone → SC → IPsec → DC edge → Jira.","Return: Jira → DC routing must send the MU pool to the SC → back to the SPN → laptop."],
      why:["Interviewers test whether you think in flows and failure points, not boxes.","Asymmetric return through a stateful DC firewall is the classic silent failure."],
      ex:"After migration, the DC still routes 10.200.0.0/16 (the MU pool) to the old VPN concentrator. Sessions show <code>incomplete</code>; fixing the route on the DC core resolves it.",
      say:["I always check two hidden dependencies first: internal DNS for the corporate domain and the return route for the mobile user pool.","If the log says allow but the app is incomplete, the handshake never finished, so I look at the path to the server and back."],
      traps:["Stopping at the SPN and ignoring the DC side.","Forgetting DNS entirely."]
    }},
  { id:"o52", title:"Authenticated, yet locked out", who:"Panel", ini:"PN",
    scene:"A remote employee shows you a green 'Connected' icon and an app that won't load.",
    q:"A remote employee authenticates to Prisma Access successfully but can't reach a private application. Walk me through your troubleshooting workflow, then tell me how you'd use this in SE enablement.",
    keys:["Scopes first: who, which apps, FQDN vs. IP, since when, what changed","Checks client, tunnel and split-tunnel configuration","Checks DNS for internal domains","Interprets logs: no log vs. deny vs. allow-incomplete, with deny causes (group, HIP, App-ID)","Checks SC or connector health, BGP and the return route for the MU pool","Checks application-side ACLs and MTU","Ends with prevention and a fault-injection lab assessed on time to root cause"],
    dojo:{
      def:"An <b>evidence-led workflow</b> narrows the fault one layer at a time, and each step names the evidence that rules a layer in or out.",
      how:["Scope: one user or many, one app or all, FQDN and IP, since when, what changed.","Client: which gateway and location, MU IP, split-tunnel exclusions, HIP report.","DNS: does the name resolve to the internal address through the tunnel?","Logs (SCM / Strata Logging Service): no log → never reached the SPN; deny → which rule (group sync, HIP, App-ID or application-default mismatch); allow + incomplete → path problem; also threat, URL and decryption logs.","Path: SC tunnel and BGP, app prefix learned, MU pool routed back, DC firewall allows the pool; or connector group health and app target status.","App: server ACLs pinned to the old VPN pool, MTU/MSS, server-initiated flows.","Prevent: runbook, pre-change check, lab."],
      why:["This is the most likely technical question in the loop.","Turning it into a lab shows you think like an enablement architect."],
      ex:"Lab design: five injected faults (split-tunnel exclusion, missing internal domain, return route, HIP mismatch, App-ID mismatch); SEs scored on time to root cause and the evidence they cite.",
      say:["I scope first, then go layer by layer: client, DNS, policy logs, routing and return path, then the application.","I'd turn this into a fault-injection lab and assess SEs on time to root cause, not on whether they know the answer."],
      traps:["Jumping straight to 'check the firewall rules'.","Not explaining what each log result means."]
    }},
  { id:"o53", title:"The three riddles", who:"Principal SASE Architect", ini:"PA",
    scene:"Three users each bring a different riddle written in log entries.",
    q:"(a) An app works by IP but not by name. (b) Logs show allow with application 'incomplete'. (c) Small pages load but large downloads stall. What does each tell you, and what do you check?",
    keys:["(a) DNS: internal domain not configured in Prisma Access or a split DNS problem","(b) TCP handshake didn't complete: routing or return path, SC/BGP, DC firewall","(c) MTU/MSS over IPsec, blocked fragmentation","Names the specific evidence for each","Proposes a fix and a prevention step for each"],
    dojo:{
      def:"Symptoms are signatures. Learn the three most common ones and the layer each points to.",
      how:["By IP yes, by name no → internal DNS domains and servers in Prisma Access; client using tunnel DNS?","Allow + <code>incomplete</code> → SYN sent, no completed handshake: route to the server, return route of the MU pool, DC firewall.","Small OK, large stalls → IPsec overhead; check MSS clamping and fragmentation along the path."],
      why:["Fast pattern recognition sounds senior and saves troubleshooting time."],
      ex:"Large SharePoint downloads stall only for remote users after go-live; lowering TCP MSS on the tunnel resolves it.",
      say:["'Works by IP, not by name' is DNS until proven otherwise.","'Incomplete' tells me the handshake never finished, so I follow the path to the server and back."],
      traps:["Treating 'incomplete' as a policy deny."]
    }}
  ]},
{ id:"q6", name:"WAN Rivers", topic:"Prisma SD-WAN and the management plane", weight:2, day:"Sat",
  intro:"The rivers carry every branch's traffic. Know how the boats choose their channel, and who steers them.",
  docs:["sdwan","scm","repo"],
  obstacles:[
  { id:"o61", title:"The channel chooser", who:"Regional SE Leader", ini:"SE",
    scene:"A Catalyst SD-WAN veteran on your team is sceptical about 'app-defined' SD-WAN.",
    q:"Explain to a Catalyst SD-WAN engineer how Prisma SD-WAN chooses a path for an application, and how it compares with Juniper SSR.",
    keys:["Contrasts Catalyst BFD probes per tunnel and SLA classes with per-app session measurement on ION","Path policy with active, backup and failover paths plus performance thresholds","Example where app-level measurement catches what probes miss","Native Prisma Access integration auto-provisions tunnels","SSR is session-based and tunnel-free (secure vector routing)","Notes a tradeoff such as dependence on accurate app identification"],
    dojo:{
      def:"<b>Prisma SD-WAN</b> (from the CloudGenix acquisition) is app-defined SD-WAN. ION devices identify the application per session and measure that application's performance on every path "+V+" for current first-packet wording.",
      how:["Path policies set active, backup and L3 failure paths per app.","Performance policies set thresholds (latency, jitter, loss, app response) that trigger path changes.","QoS, NAT and zone-based firewall policies run on the ION.","Native integration auto-provisions IPsec to Prisma Access remote networks.","Catalyst: OMP, TLOCs, BFD probes per tunnel against SLA classes. SSR: session-based, tunnel-free, with metadata on the first packet."],
      why:["Shows you understand design philosophies, not vendor names.","Gives SEs a competitive talk track grounded in mechanics."],
      ex:"A SaaS app degrades on one ISP while ICMP probes look clean; the ION sees the app's response time rise and moves that app to the second circuit.",
      say:["Probe-based SD-WAN knows the path is healthy; app-defined SD-WAN knows the application is healthy.","Prisma SD-WAN is closer in philosophy to SSR than to Catalyst, but it still uses IPsec overlays."],
      traps:["Claiming Catalyst can't do application awareness. It can, through NBAR2 and SLA classes."]
    }},
  { id:"o62", title:"Which boat, which captain", who:"Product Manager, Prisma Access", ini:"PM",
    scene:"A customer with hundreds of Palo Alto NGFWs asks two questions in one breath.",
    q:"Should we use Prisma SD-WAN or SD-WAN on our existing NGFWs? And Panorama or Strata Cloud Manager to manage it all?",
    keys:["Prisma SD-WAN (ION) is the strategic SASE edge; PAN-OS SD-WAN is a Panorama plugin on NGFWs","PAN-OS SD-WAN fits one-box branches with simpler SD-WAN needs","SCM recommended for greenfield and unified management of NGFW, Prisma Access and SD-WAN","Panorama for large mature estates; coexistence with a migration plan","Folders and snippets vs. device groups and templates","Verify feature parity before committing"],
    dojo:{
      def:"<b>PAN-OS SD-WAN</b> is SD-WAN on Palo Alto NGFWs, configured through a Panorama plugin. <b>Strata Cloud Manager (SCM)</b> is cloud management for NGFW, Prisma Access and Prisma SD-WAN, with AIOps. <b>Panorama</b> is the on-prem or virtual manager using device groups and templates.",
      how:["SCM: folders (inheritance), snippets (reusable config), Command Center, best-practice checks, Policy Analyzer, an AI assistant "+V+".","Panorama can still manage Prisma Access; new features increasingly arrive in SCM first "+V+".","Logs go to Strata Logging Service either way."],
      why:["Customers with large NGFW estates ask this constantly.","Mixing up the two SD-WAN offerings is a common mistake interviewers check for."],
      ex:"A bank keeps Panorama for 300 DC and campus firewalls, uses SCM for Prisma Access and new ION branches, and plans a phased move as parity allows.",
      say:["One box at the branch with simple needs: PAN-OS SD-WAN. Strategic SASE edge with app-defined paths: Prisma SD-WAN.","Greenfield goes to SCM; a mature Panorama estate coexists with a migration plan once I've checked feature parity."],
      traps:["Saying Prisma SD-WAN runs on NGFWs.","Recommending a Panorama rip-and-replace."]
    }}
  ]},
{ id:"q7", name:"Watchtowers", topic:"CASB, DLP, ADEM and Prisma Access Browser", weight:1, day:"Sat",
  intro:"From the towers you watch data leave and experience degrade. Know which tower watches what.",
  docs:["saas","dlp","adem"],
  obstacles:[
  { id:"o71", title:"The silent calls", who:"Panel", ini:"PN",
    scene:"Weeks after go-live, remote users complain that Teams calls sound robotic.",
    q:"After a Prisma Access migration, remote users say Teams calls are poor. How do you diagnose it with ADEM, and which design choices could cause or fix it?",
    keys:["Uses ADEM segments: device, Wi-Fi/LAN, ISP, Prisma Access, app","Looks for patterns (same ISP or city, same location)","Considers split tunnel or local breakout for Teams media per current guidance","Considers decryption exclusions for real-time media","Considers location and compute region mapping and latency","Turns findings into a runbook or SE talking point"],

  const nodes = [...QUESTS.map(q => ({ id:q.id, name:q.name, sub:q.day + " · " + q.obstacles.length + " obstacles", cleared:questCleared(q), started:questStarted(q), score:questScore(q) })),
    { id:"hall", name:"Interview Hall", sub:"Final role-play", cleared:hallDone(), started:S.hall.turns.length > 0, final:true }];
  const segs = [];
  for (let i = 0; i < POS.length - 1; i++) {
    const [x1, y1] = POS[i], [x2, y2] = POS[i + 1];
    const d = y1 === y2 ? `M${x1} ${y1} L${x2} ${y2}` : (x1 > 500 ? `M${x1} ${y1} C${x1 + 75} ${y1} ${x2 + 75} ${y2} ${x2} ${y2}` : `M${x1} ${y1} C${x1 - 75} ${y1} ${x2 - 75} ${y2} ${x2} ${y2}`);
    segs.push(`<path class="seg ${nodes[i].cleared ? "done" : ""}" d="${d}"/>`);
  }
  const cur = currentQuest(); const curIdx = cur ? QUESTS.indexOf(cur) : (hallDone() ? -1 : 11);
  const nodeSvg = nodes.map((n, i) => {
    const [x, y] = POS[i], cls = ["node", n.cleared ? "cleared" : n.started ? "started" : "", n.final ? "final" : ""].join(" ");
    const num = n.final ? "★" : n.cleared ? "✓" : String(i + 1);
    const sub = n.cleared && !n.final ? "Cleared · " + n.score : n.sub;
    return `<a href="#${n.id}" class="${cls}" aria-label="${esc(n.name)}"><circle cx="${x}" cy="${y}" r="30"/><text class="num" x="${x}" y="${y}">${num}</text>
      <text class="nm" x="${x}" y="${y + 52}">${esc(n.name)}</text><text class="sub" x="${x}" y="${y + 68}">${esc(sub)}</text></a>`;
  }).join("");
  let flag = "";
  if (curIdx >= 0) { const [x, y] = POS[curIdx]; flag = `<g class="flag"><line x1="${x + 22}" y1="${y - 26}" x2="${x + 22}" y2="${y - 62}"/><path d="M${x + 23} ${y - 62} l26 8 l-26 8 z"/><text x="${x + 22}" y="${y - 68}">you</text></g>`; }
  return `<svg class="map" viewBox="0 0 1000 460" role="img" aria-label="Quest map">${segs.join("")}${nodeSvg}${flag}</svg>`;
}

/* ================================================================ grading */
async function grade(o, which, text) {
  const r = ob(o.id), msg = $("msg-" + o.id + "-" + which);
  const sample = await getSample();
  if (!sample) { msg.textContent = "Claude grading isn't available here. Use the self-check."; $("self-" + o.id + "-" + which).hidden = false; return; }
  msg.textContent = which === 1 ? "The interviewer is weighing your answer…" : "Judging your second attempt…";
  document.querySelectorAll(`[data-grade="${o.id}:${which}"]`).forEach(b => b.disabled = true);
  const prompt = `You are a demanding but constructive Palo Alto Networks interviewer grading a practice answer for the role Technical Enablement Architect, Network Security & SASE (JR-017228). The role owns multi-quarter technical readiness strategy, SE learning journeys, labs, competency models and launch readiness for Prisma SASE and NGFW.
${BG}
Judge technical accuracy against current Palo Alto terminology. If the candidate states a product detail that changes between releases, say it should be verified instead of marking it wrong. Penalize vagueness and marketing language. Reward mechanisms, tradeoffs, failure modes and links to field enablement.

Interviewer: ${o.who}
Question: ${o.q}
Key points a strong answer covers:
${o.keys.map(k => "- " + k).join("\n")}
${which === 2 && r.a1 ? `\nThe candidate's first attempt (before training) was:\n"""${r.a1}"""\n` : ""}
Candidate answer${which === 2 ? " (second attempt, after training)" : ""}:
"""${text}"""

Reply with only JSON in this shape:
{"scores":{"accuracy":1,"depth":1,"problem_solving":1,"communication":1,"strategy":1,"relevance":1},"overall":0,"covered":["what they did well, short"],"missing":["what to improve, short and specific"],"followup":"one probing follow-up question",${which === 2 ? '"growth":"one or two sentences comparing this attempt with the first",' : ""}"improved":"..."}
Each score is an integer 1-5. "overall" is 0-100 and reflects key-point coverage and the scores. "improved" is a strong answer of 120-220 words in first person using only experience listed in the candidate background; never invent metrics, employers, deployments or accomplishments; use [placeholder] where a personal detail is needed.`;
  try {
    const res = await sample.json(prompt, { modelTier:"default" });
    if (!res || typeof res !== "object" || !res.scores) throw { code:"invalid_json" };
    res.overall = Math.max(0, Math.min(100, Math.round(Number(res.overall) || 0)));
    applyResult(o, which, text, res);
  } catch (e) {
    msg.innerHTML = sampleErr(e); $("self-" + o.id + "-" + which).hidden = false;
    document.querySelectorAll(`[data-grade="${o.id}:${which}"]`).forEach(b => b.disabled = false);
  }
}
function applyResult(o, which, text, res) {
  const r = ob(o.id);
  if (which === 1) { r.a1 = text; r.r1 = res; r.stage = "encounter"; }
  else { r.a2 = text; r.r2 = res; r.stage = "cleared"; r.final = Math.max(res.overall, r.r1 && r.r1.overall >= 85 ? r.r1.overall : 0); }
  save(); route(o.id);
}

  msg.textContent = "The panel confers…";
  try {
    const r = await sample.json(`${HALL_SYS()}\n\nTranscript so far:\n${transcript() || "(none)"}\n\nAsk the next question. Reply with only JSON: {"who":"Hiring Manager|Principal SASE Architect|Director of Field Enablement","category":"technical|troubleshooting|design|strategy|behavioral|motivation","question":"..."}`, { modelTier:"default", cache:false });
    if (!r || !r.question) throw { code:"invalid_json" };
    S.hall.turns.push({ q:String(r.question), cat:String(r.category || ""), who:String(r.who || "Panel") });
    save(); route(); return true;
  } catch (e) { msg.innerHTML = sampleErr(e); return false; }
}
function bindHall() {
  const st = $("hall-start"); if (st) st.onclick = () => { st.disabled = true; hallAsk().then(ok => { if (!ok) st.disabled = false; }); };
  const rs = $("hall-reset"); if (rs) rs.onclick = () => { if (rs.dataset.armed) { S.hall = { turns:[], draft:"" }; save(); route(); } else { rs.dataset.armed = "1"; rs.textContent = "Click again to erase this role-play"; } };
  const ta = $("hall-ans"); if (ta) ta.oninput = () => { S.hall.draft = ta.value; persistLocal(); };
  const sk = $("hall-skip"); if (sk) sk.onclick = () => { S.hall.turns.pop(); save(); hallAsk(); };
  const sd = $("hall-send");
  if (sd) sd.onclick = async () => {
    const a = ta.value.trim(), msg = $("hall-msg");
    if (a.length < 40) { msg.textContent = "Give a full answer, as you would in the room."; return; }
    const sample = await getSample(); if (!sample) { msg.textContent = "Claude isn't available in this view."; return; }
    sd.disabled = true; msg.textContent = "The panel scores your answer…";
    const t = S.hall.turns[S.hall.turns.length - 1]; t.a = a;
    try {
      const r = await sample.json(`${HALL_SYS()}\n\nTranscript so far:\n${transcript()}\n\nScore the latest answer (A${S.hall.turns.length}), then choose the next question: a follow-up if the answer was vague or incomplete and no follow-up has been asked on this topic yet, otherwise a new topic.\nReply with only JSON:\n{"scores":{"accuracy":1,"depth":1,"problem_solving":1,"communication":1,"strategy":1,"relevance":1},"missing":["specific gaps"],"improved":"a strong first-person answer of 120-200 words using only the candidate's real background; never invent metrics or accomplishments; use [placeholder] for details to confirm","next":{"type":"followup|new","who":"...","category":"...","question":"..."}}\nScores are integers 1-5.`, { modelTier:"default", cache:false });
      if (!r || !r.scores) throw { code:"invalid_json" };
      const vals = CATS.map(([k]) => Math.max(1, Math.min(5, Number(r.scores[k]) || 1)));
      t.eval = { scores:r.scores, missing:r.missing || [], improved:r.improved || "", pct:Math.round(vals.reduce((s, v) => s + v, 0) / vals.length * 20) };
      S.hall.draft = "";
      if (r.next && r.next.question) S.hall.turns.push({ q:String(r.next.question), cat:String(r.next.category || ""), who:String(r.next.who || "Panel"), followup:r.next.type === "followup" });
      save(); route();
    } catch (e) { t.a = null; msg.innerHTML = sampleErr(e); sd.disabled = false; }
  };
  const vd = $("hall-verdict");
  if (vd) vd.onclick = async () => { vd.disabled = true; await makeVerdict(); };
}

/* ================================================================ verdict */
function localVerdict() {
  const well = [], improve = [];
  OBS.forEach(o => { const r = S.obs[o.id] || {}, res = r.r2 || r.r1; if (res) { (res.covered || []).slice(0, 1).forEach(x => well.push(o.title + ": " + x)); (res.missing || []).slice(0, 1).forEach(x => improve.push(o.title + ": " + x)); } });
  S.hall.turns.filter(t => t.eval).forEach(t => (t.eval.missing || []).slice(0, 1).forEach(x => improve.push("Role-play: " + x)));
  const weakest = OBS.filter(o => obScore(o) != null).sort((a, b) => obScore(a) - obScore(b)).slice(0, 3);
  return { verdict: readiness() >= 80 ? "You're ready to face the panel." : "You're close, but some regions need another pass before Monday.",
    learning: QUESTS.filter(questStarted).map(q => q.name + ": " + q.topic + " (" + questScore(q) + ")"),
    strengths: well.slice(0, 6), improve: improve.slice(0, 6),
    good: weakest.map(o => o.title + ": " + o.dojo.say[0]),
    monday: ["Read the 'Say this' lines for your three weakest obstacles.", "Rehearse your two STAR stories out loud once.", "Have your questions for the hiring manager ready."], local:true };
}
async function makeVerdict() {
  const msg = $("hall-msg"), sample = await getSample();
  const facts = { knowledge:knowledge(), roleplay:hallScore(), readiness:readiness(),
    quests: QUESTS.map(q => ({ region:q.name, topic:q.topic, score:questScore(q), cleared:questCleared(q),
      obstacles: q.obstacles.map(o => { const r = S.obs[o.id] || {}, res = r.r2 || r.r1; return { title:o.title, first:r.r1 ? r.r1.overall : null, final:obScore(o), well:res ? (res.covered || []).slice(0, 3) : [], gaps:res ? (res.missing || []).slice(0, 3) : [] }; }) })),
    roleplay_turns: S.hall.turns.filter(t => t.eval).map(t => ({ q:t.q, score:t.eval.pct, gaps:(t.eval.missing || []).slice(0, 3) })) };
  if (!sample) { S.verdict = localVerdict(); save(); location.hash = "#verdict"; return; }
  if (msg) msg.textContent = "The panel deliberates…";
  try {
    const r = await sample.json(`You are the hiring panel at Palo Alto Networks for Technical Enablement Architect, Network Security & SASE (JR-017228). The interview is Monday Nov 2, 2026.
${BG}
Here is the candidate's full preparation record as JSON:
${JSON.stringify(facts)}

Write the final verdict. Reply with only JSON:
{"verdict":"two or three sentences: would this candidate advance today, and why","learning":["one line per region: the key lesson the candidate learned"],"strengths":["specific things done well"],"improve":["the most important specific improvements, ranked"],"good":["what a strong answer sounds like for each of the candidate's three weakest areas, one or two sentences each, first person, no invented metrics"],"monday":["concrete actions for the remaining time before the interview"]}`, { modelTier:"default", cache:false });
    if (!r || !r.verdict) throw { code:"invalid_json" };
    S.verdict = r; save(); location.hash = "#verdict";
  } catch (e) { S.verdict = localVerdict(); save(); location.hash = "#verdict"; }
}
function viewVerdict() {
  const v = S.verdict, r = readiness(), k = knowledge(), h = hallScore();
  if (!v) return `<section class="panel stack"><h2>No verdict yet</h2><p class="lead">Finish at least five answers in the Interview Hall to receive it.</p><div class="row"><button type="button" data-go="hall">Go to the Interview Hall</button></div></section>`;
  const list = (t, a) => a && a.length ? `<div class="stack"><h3>${t}</h3><ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  return `
<section class="panel verdict stack">
  <span class="label">Journey's end · <a href="#map">back to map</a></span>
  <h2>The verdict</h2>
  <div class="bigs">
    <div class="tile"><span class="label">Readiness</span><b class="tnum">${r}</b><span class="pill ${tone(r)}">${r >= 80 ? "Ready to face the interviewer" : r >= 60 ? "Close" : "More training needed"}</span></div>
    <div class="tile"><span class="label">Rank</span><b>${rankOf(r)}</b></div>
    <div class="tile"><span class="label">Knowledge</span><b class="tnum">${k}</b><span class="note">${cleared()} of ${OBS.length} obstacles cleared</span></div>
    <div class="tile"><span class="label">Role-play</span><b class="tnum">${h == null ? "–" : h}</b><span class="note">${S.hall.turns.filter(t => t.eval).length} answers scored</span></div>
  </div>
  <p class="lead">${esc(v.verdict)}</p>
  ${v.local ? `<p class="note">Compiled from your saved results because Claude wasn't available for the panel's write-up.</p>` : ""}
</section>
<section class="panel"><div class="twocol" style="gap:22px">${list("Things you did well", v.strengths)}${list("Things to improve", v.improve)}</div></section>
<section class="panel stack">${list("Notes of your learning", v.learning)}</section>
<section class="panel stack"><h3>What good looks like</h3><div class="say">${(v.good || []).map(x => `<p>${esc(x)}</p>`).join("")}</div></section>
<section class="panel stack">${list("Before Monday morning", v.monday)}
  <div class="row"><button type="button" class="ghost" id="re-verdict">Ask the panel again</button><button type="button" class="ghost" data-go="map">Back to the map</button></div></section>`;
}

/* ================================================================ router + events */
function route(focusObs) {
  const id = (location.hash || "#map").slice(1), v = $("view");
  const q = QUESTS.find(x => x.id === id);
  if (q) v.innerHTML = viewQuest(q);
  else if (id === "hall") { v.innerHTML = viewHall(); bindHall(); }
  else if (id === "verdict") { v.innerHTML = viewVerdict(); const b = $("re-verdict"); if (b) b.onclick = () => { b.disabled = true; makeVerdict(); }; }
  else v.innerHTML = viewMap();
  header();
  if (focusObs) { const c = $("card-" + focusObs); if (c) c.scrollIntoView({ block:"start", behavior:"smooth" }); }
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("button,[data-go]"); if (!t) return;
  const d = t.dataset;
  if (d.go) { const h = "#" + d.go; if (location.hash === h) route(); else location.hash = h; window.scrollTo(0, 0); return; }
  if (d.open) { const qid = OBS.find(o => o.id === d.open).quest.id; S.open[qid] = S.open[qid] === d.open && t.getAttribute("aria-expanded") === "true" ? "__none" : d.open; persistLocal(); route(d.open); return; }
  if (d.next) { const o = OBS.find(x => x.id === d.next); S.open[o.quest.id] = o.id; persistLocal(); route(o.id); return; }
  if (d.stage) { const [id, st] = d.stage.split(":"); const r = ob(id); r.stage = st; if (st === "retest") r.d2 = ""; save(); route(id); return; }
  if (d.skip) { const r = ob(d.skip); r.skipped = true; r.stage = "dojo"; save(); route(d.skip); return; }
  if (d.clearnow) { const r = ob(d.clearnow); r.stage = "cleared"; r.final = r.r1.overall; save(); route(d.clearnow); return; }
  if (d.selfopen) { const el = $("self-" + d.selfopen.replace(":", "-")); if (el) el.hidden = false; return; }
  if (d.grade) {
    const [id, w] = d.grade.split(":"), o = OBS.find(x => x.id === id), text = $("ans-" + id + "-" + w).value.trim();
    if (text.length < 60) { $("msg-" + id + "-" + w).textContent = "Write at least a few sentences first."; return; }
    grade(o, Number(w), text); return;
  }
  if (d.selfscore) {
    const [id, w] = d.selfscore.split(":"), o = OBS.find(x => x.id === id), text = ($("ans-" + id + "-" + w) || {}).value || "";
    const checks = o.keys.map((k, ki) => $("chk-" + id + "-" + w + "-" + ki).checked);
    const res = { overall:Math.round(checks.filter(Boolean).length / checks.length * 100), covered:o.keys.filter((k, i) => checks[i]), missing:o.keys.filter((k, i) => !checks[i]), self:true };
    applyResult(o, Number(w), text, res); return;
  }
});
document.addEventListener("input", ev => {
  const d = ev.target.dataset && ev.target.dataset.draft; if (!d) return;
  const [id, w] = d.split(":"), r = ob(id); r["d" + w] = ev.target.value; persistLocal();
});
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
setInterval(header, 60000);
route();
})();
</script>
