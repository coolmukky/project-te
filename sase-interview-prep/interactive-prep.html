<style>
/* Layout: a runbook. Left rail lists the hops (steps) in order; the main pane holds learn, then validate, then the result. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --sunk:#e3e9ee; --ink:#13202c; --muted:#566878; --line:#cfd8e0;
  --accent:#0a5a9c; --accent-ink:#ffffff; --accent-soft:#dbe9f6; --signal:#a85f00;
  --good:#1b7444; --good-soft:#dcefe3; --warn:#9a5c00; --warn-soft:#f6ead6; --bad:#b0281d; --bad-soft:#f7dfdc;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#161f28; --sunk:#1d2833; --ink:#e4ebf1; --muted:#93a5b5; --line:#2b3a47;
  --accent:#62aef0; --accent-ink:#06121d; --accent-soft:#17324a; --signal:#e3a347;
  --good:#52c58c; --good-soft:#143326; --warn:#e3a347; --warn-soft:#3a2b14; --bad:#f2786d; --bad-soft:#3d1c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161f28; --sunk:#1d2833; --ink:#e4ebf1; --muted:#93a5b5; --line:#2b3a47;
  --accent:#62aef0; --accent-ink:#06121d; --accent-soft:#17324a; --signal:#e3a347;
  --good:#52c58c; --good-soft:#143326; --warn:#e3a347; --warn-soft:#3a2b14; --bad:#f2786d; --bad-soft:#3d1c19; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:1.5rem}
h2{font-size:2.1rem}
h3{font-size:1.35rem}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.brand{display:flex;flex-direction:column;gap:0;min-width:0}
.brand small{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.04em}
.meters{display:flex;gap:18px;margin-left:auto;align-items:center;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;gap:3px;min-width:120px}
.meter .bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.meter b{font-family:var(--mono);font-size:.9rem;font-weight:500}
.sync{font-family:var(--mono);font-size:.68rem;color:var(--muted)}

/* shell */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.rail summary{display:none}
.rail nav{display:flex;flex-direction:column;gap:14px}
.daygrp{display:flex;flex-direction:column;gap:2px}
.daygrp > .label{padding:0 8px 4px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;
  color:var(--ink);text-decoration:none;border:1px solid transparent}
.step:hover{background:var(--surface)}
.step[aria-current="page"]{background:var(--surface);border-color:var(--line)}
.step .n{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.step .t{font-size:.88rem;line-height:1.25;min-width:0}
.step .t small{display:block;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.dot.ready{background:var(--good);border-color:var(--good)}
.dot.dev{background:var(--warn);border-color:var(--warn)}
.dot.need{background:var(--bad);border-color:var(--bad)}
.dot.prog{background:var(--accent-soft);border-color:var(--accent)}

main{min-width:0;display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.panel > * + *{margin-top:12px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.chip.p0{color:var(--bad);border-color:var(--bad)}
.chip.p1{color:var(--warn);border-color:var(--warn)}
.chip.p2{color:var(--muted)}
.status{font-family:var(--mono);font-size:.74rem;padding:3px 9px;border-radius:4px;font-weight:500}
.status.ready{background:var(--good-soft);color:var(--good)}
.status.dev{background:var(--warn-soft);color:var(--warn)}
.status.need{background:var(--bad-soft);color:var(--bad)}
.status.none,.status.prog{background:var(--sunk);color:var(--muted)}
.objective{font-size:1.05rem;max-width:68ch}

.learn{max-width:72ch}
.learn ul{padding-left:1.15rem;margin:.4rem 0}
.learn li{margin:.3rem 0}
.learn h4{font-family:var(--display);font-size:1.12rem;margin:1.1rem 0 .3rem;letter-spacing:.02em}
.learn code,.mono-inline{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:3px}
.learn .flow{font-family:var(--mono);font-size:.8rem;background:var(--sunk);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.5}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.v{font-family:var(--mono);font-size:.68rem;padding:0 5px;border-radius:3px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}

.res{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.res li{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.res li span{font-size:.8rem;color:var(--muted)}

.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0}
fieldset + fieldset{margin-top:10px}
legend{font-weight:600;padding:0 4px;font-size:.95rem}
.opt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:5px;cursor:pointer}
.opt:hover{background:var(--sunk)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.right{background:var(--good-soft)}
.opt.wrong{background:var(--bad-soft)}
.explain{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin-top:6px}
.explain.ok{border-color:var(--good)}
.explain.no{border-color:var(--bad)}

textarea{width:100%;min-height:170px;font:inherit;font-size:.95rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;font-size:.9rem;font-weight:600;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
.note{font-size:.84rem;color:var(--muted)}
.err{color:var(--bad);font-size:.86rem}

.scorecard{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sc b{font-family:var(--mono);font-size:1.25rem;font-weight:500}
.cat{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:.85rem}
.cat .bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--accent)}
.feedback ul{padding-left:1.1rem;margin:.3rem 0}
.improved{background:var(--sunk);border-radius:8px;padding:12px 14px;font-size:.92rem;white-space:pre-wrap}
.checks{display:flex;flex-direction:column;gap:4px}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
.gauge{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.gauge .big{font-family:var(--display);font-size:4.4rem;line-height:.9;font-weight:700}
.gauge .big small{font-size:1.6rem;color:var(--muted)}
.domains{display:flex;flex-direction:column;gap:8px}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.plan .day{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.plan .day ol{margin:.4rem 0 0;padding-left:1.2rem;font-size:.88rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* mock */
.chat{display:flex;flex-direction:column;gap:14px}
.turn{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.qbub{font-weight:600;max-width:72ch}
.abub{background:var(--sunk);border-radius:8px;padding:10px 12px;white-space:pre-wrap;max-width:72ch;font-size:.92rem}

.revision{columns:2 320px;column-gap:28px}
.revision section{break-inside:avoid;margin-bottom:14px}
.revision h4{font-family:var(--display);font-size:1.1rem;margin:0 0 4px}
.revision ul{padding-left:1.1rem;margin:0;font-size:.88rem}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 48px}
  .rail{position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
  .rail summary{display:flex;justify-content:space-between;cursor:pointer;padding:6px 8px;font-weight:600}
  .rail nav{padding-top:8px}
  .hero{grid-template-columns:minmax(0,1fr)}
  h2{font-size:1.8rem}
  .panel{padding:16px}
  .meters{margin-left:0;width:100%;gap:12px}
  .top{position:static}
  .meter{min-width:100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(() => {
"use strict";

/* ---------------------------------------------------------------- content */
const V = '<span class="v">verify</span>';
const BG = "Candidate background: Technical Enablement Architect at Cisco Systems supporting security enablement (global SE readiness, a Zero Trust Architecture Design Clinic prototype, collaboration with Product, GTM, SMEs, learning design). Previously at Juniper Networks in customer-facing Systems Engineering, technical enablement and technical instruction. Technical: enterprise routing and switching, Juniper SRX, Cisco Firepower / Secure Firewall, Cisco ISE, Zero Trust and identity-based segmentation, Cisco and Juniper SD-WAN, Juniper EX and Mist, EVPN/VXLAN, Apstra, Python, Ansible, lab environments. MS in Information Systems Technology and an MBA. Limited hands-on Prisma SASE experience.";

const MODULES = [
{ id:"m1", day:1, title:"SASE, SSE and the Prisma SASE portfolio", time:"40 min", prio:"P0", weight:3,
  objective:"Explain SASE vs. SSE and draw the Prisma SASE stack from memory, including what makes it architecturally different.",
  learn:`
<h4>Definitions you must say cleanly</h4>
<ul>
<li><b>SSE</b> (Security Service Edge) is cloud-delivered security for users and traffic: SWG, CASB and ZTNA, usually with FWaaS and DLP.</li>
<li><b>SASE</b> is SSE plus the WAN edge (SD-WAN), converged under one policy, management and telemetry model.</li>
<li><b>Prisma SASE</b> = <b>Prisma Access</b> (the SSE) + <b>Prisma SD-WAN</b> (ION devices), managed in <b>Strata Cloud Manager</b>, with <b>ADEM</b> for experience, <b>Cloud Identity Engine</b> for identity and <b>Strata Logging Service</b> for logs.</li>
</ul>
<h4>The architectural claim</h4>
<ul>
<li>Prisma Access security processing nodes (SPNs) run <b>PAN-OS</b>. App-ID, User-ID, Content-ID and the security policy model behave the same as on an on-prem NGFW, on all ports and protocols, not only HTTP/S.</li>
<li>For enablement this means SE firewall skills transfer to SASE, so a shared core curriculum is possible.</li>
<li>For customers it means Prisma Access is operated like a firewall (rules, zones, commits), which suits network security teams and is heavier for proxy-only web teams.</li>
</ul>
<h4>Single-vendor vs. dual-vendor tradeoff</h4>
<ul>
<li>Single vendor: one policy and data model, integrated troubleshooting (for example ADEM across SD-WAN and SSE). Cost: dependency on the weakest component, lock-in.</li>
<li>Dual vendor: best-of-breed choice, more integration work (tunnels, identity, correlating telemetry).</li>
<li>Prisma Access accepts IPsec from any vendor's CPE, so SSE-first is a valid path when the WAN isn't the problem.</li>
</ul>
<div class="flow">Users ── GlobalProtect / Agent / Explicit Proxy / Browser ──► Mobile User SPN ─┐
Branch ── ION or any IPsec CPE ───────────────────────► Remote Network SPN ┼─► Internet / SaaS
                                                                           └─► DC via Service Connection
                                                                               or ZTNA Connector
Management: Strata Cloud Manager · Logs: Strata Logging Service · Identity: Cloud Identity Engine</div>`,
  resources:[
    ["Prisma SASE overview (official)","https://www.paloaltonetworks.com/sase","Product framing and terminology"],
    ["Prisma Access TechDocs","https://docs.paloaltonetworks.com/prisma-access","Search: Prisma Access Overview"],
    ["Strata Cloud Manager TechDocs","https://docs.paloaltonetworks.com/strata-cloud-manager","Skim the getting-started page"],
    ["Repo notes: 00-START-HERE.md §4 and 02-technology-mapping.md §2–3","https://github.com/coolmukky/project-te/tree/claude/zealous-cannon-6vv5py/sase-interview-prep","Your written study pack"]
  ],
  quiz:[
    {q:"Which combination best describes SSE?", o:["SD-WAN + FWaaS","SWG + CASB + ZTNA, usually with FWaaS and DLP","NGFW + NAC","SD-WAN + ZTNA + NAC"], a:1, e:"SSE is the security half of SASE. SD-WAN is what turns SSE into SASE."},
    {q:"What is Palo Alto's main architectural argument for Prisma Access against proxy-centric SSE?", o:["It has more PoPs than anyone","Its security nodes run PAN-OS, so App-ID and Content-ID apply to all ports and protocols","It doesn't need an agent","It only inspects DNS"], a:1, e:"Policy parity with the NGFW and full L3–L7 inspection beyond HTTP/S is the core claim. PoP counts change and aren't an architectural argument."},
    {q:"A customer deployed another vendor's SD-WAN last year. Their pain is remote users and SaaS security. What do you recommend first?", o:["Rip and replace with Prisma SD-WAN now","Prisma Access (SSE), onboarding branches as remote networks over IPsec from the existing CPE, and revisit SD-WAN at refresh","Keep backhauling to the DC","Deploy NGFWs at every branch"], a:1, e:"Prisma Access takes IPsec from third-party CPE. Lead with the problem the customer actually has."},
    {q:"Which component supplies directory groups and cloud authentication for Prisma Access policy?", o:["Strata Logging Service","Cloud Identity Engine","ADEM","Panorama"], a:1, e:"CIE syncs users and groups (Entra ID, AD, Okta and others) and provides SAML authentication."},
    {q:"Where do Prisma Access logs land by default?", o:["A syslog server you host","Strata Logging Service","Panorama local disk only","The ION device"], a:1, e:"Strata Logging Service (formerly Cortex Data Lake). It can forward to a SIEM."}
  ],
  open:{prompt:"In about 90 seconds, explain Prisma SASE to a Cisco-trained SE joining Palo Alto. Cover what it is, what is architecturally different, and one real tradeoff.",
    keys:["Defines SSE vs. SASE correctly","Names Prisma Access, Prisma SD-WAN, SCM, CIE, Strata Logging Service, ADEM","States that SPNs run PAN-OS, giving App-ID and Content-ID on all ports and protocols","Describes the onboarding paths (mobile users, remote networks, service connections or ZTNA Connector)","Gives an honest tradeoff (lock-in, firewall-style operations, or migration effort)","Maps at least one piece to the Cisco equivalent (for example Secure Access)"]}
},
{ id:"m2", day:1, title:"Prisma Access building blocks", time:"1 h 45", prio:"P0", weight:3,
  objective:"Explain mobile users, remote networks, service connections, ZTNA Connector, locations vs. compute locations, and the infrastructure subnet, with the reason each exists.",
  learn:`
<div class="tbl"><table>
<tr><th>Construct</th><th>What it is</th><th>Why it exists</th></tr>
<tr><td>Mobile Users</td><td>GlobalProtect (portal and gateways hosted in Prisma Access), Prisma Access Agent ${V}, Explicit Proxy (PAC file), Prisma Access Browser</td><td>Secure remote users. Tunnel mode captures all traffic. Explicit proxy covers web only.</td></tr>
<tr><td>Remote Networks</td><td>IPsec from branch CPE to an RN location, static or BGP</td><td>Secure a site's users and give them internet egress</td></tr>
<tr><td>Service Connection</td><td>IPsec + BGP to a DC, HQ or cloud VPC</td><td>Gives Prisma Access routes to private apps and gives apps a return path. It isn't general internet egress (Traffic Steering is the exception for chosen traffic).</td></tr>
<tr><td>ZTNA Connector</td><td>VM near the apps, deployed in connector groups, building <b>outbound</b> tunnels</td><td>App-level access by FQDN, wildcard or IP. No routing changes, no inbound ports, overlapping IPs tolerated.</td></tr>
<tr><td>Infrastructure subnet</td><td>RFC 1918 block you supply</td><td>Internal Prisma Access routing. It must not overlap anything you use.</td></tr>
<tr><td>Mobile user IP pools</td><td>Per-region RFC 1918 pools</td><td>Client addresses. The DC must route them back via the SC.</td></tr>
<tr><td>Location vs. compute location</td><td>Where users connect vs. the cloud region running the nodes</td><td>Drives latency, egress IP geography and RN bandwidth allocation ${V}</td></tr>
</table></div>
<h4>Service connection vs. ZTNA Connector: when you still need the SC</h4>
<ul>
<li>Servers start connections toward users or branches (SCCM push, VoIP callbacks, remote help).</li>
<li>Branches on remote networks need DC reachability through Prisma Access.</li>
<li>You need dynamic routing with the DC, or Traffic Steering egress via on-prem.</li>
<li>Typical answer: both. An SC for the core DC, connectors for cloud VPCs, M&amp;A and app enclaves.</li>
</ul>
<h4>Management choice</h4>
<ul><li>Prisma Access is cloud-managed (SCM) or Panorama-managed. Greenfield usually means SCM. ${V} Check feature parity notes.</li></ul>`,
  resources:[
    ["Prisma Access TechDocs","https://docs.paloaltonetworks.com/prisma-access","Search: Service Connections, Remote Networks, Mobile Users, ZTNA Connector, Prisma Access Locations, Infrastructure Subnet"],
    ["Cloud Identity Engine TechDocs","https://docs.paloaltonetworks.com/cloud-identity","Directory sync and SAML authentication"],
    ["GlobalProtect TechDocs","https://docs.paloaltonetworks.com/globalprotect","Portal, gateways, HIP"],
    ["Repo notes: 03-prisma-sase-architecture.md §2–5","https://github.com/coolmukky/project-te/blob/claude/zealous-cannon-6vv5py/sase-interview-prep/03-prisma-sase-architecture.md","Architecture walkthrough"]
  ],
  quiz:[
    {q:"What is the primary purpose of a service connection?", o:["General internet egress for branches","Give Prisma Access routes to private apps and give those apps a return path","Terminate GlobalProtect users","Host the GlobalProtect portal"], a:1, e:"SCs onboard resources. Internet egress happens at the location, not through the SC by default."},
    {q:"What distinguishes a remote network from a service connection?", o:["RN uses SSL, SC uses IPsec","RN onboards a site's users so their traffic is secured. SC onboards resources such as DC apps.","RN is only for AWS","There is no difference"], a:1, e:"Both are IPsec. The difference is the role: users vs. resources."},
    {q:"A compute location is…", o:["The customer's data center","The cloud region where the Prisma Access processing nodes actually run, which can serve several locations","The ISP PoP nearest the user","A Panorama object"], a:1, e:"Several Prisma Access locations can map to one compute location, which affects latency and egress IPs."},
    {q:"What must be true of the infrastructure subnet?", o:["It must be a public range","It must be RFC 1918 and must not overlap the customer's networks","It must match the MU pool","It must be /30"], a:1, e:"Prisma Access uses it internally. Overlap breaks routing."},

{ id:"m3", day:1, title:"PAN-OS core: App-ID, User-ID, Content-ID", time:"1 h 45", prio:"P0", weight:3,
  objective:"Explain how App-ID classifies traffic, where User-ID gets identities, how Content-ID profiles apply, and the policy evaluation rules that trip up SRX and Firepower engineers.",
  learn:`
<h4>App-ID</h4>
<ul>
<li>Pipeline: IP and port select the initial decoder, then <b>signatures</b>, then <b>decryption</b> if policy says so, then <b>protocol decoders</b> for tunneled apps, then <b>heuristics</b> for evasive apps.</li>
<li>Identification continues through the session. The app can shift (<code>ssl</code> → <code>web-browsing</code> → <code>facebook-base</code>) and policy is re-checked.</li>
<li>Values to know: <code>incomplete</code> (no completed handshake), <code>insufficient-data</code>, <code>unknown-tcp</code>, <code>not-applicable</code>.</li>
<li><code>service: application-default</code> allows the app only on its standard ports. It's best practice over <code>any</code>.</li>
<li><b>Application override</b> forces an identity and skips L7 inspection, so use it rarely. Write <b>custom App-IDs</b> for in-house protocols.</li>
<li><b>Policy Optimizer</b> shows the apps seen on port-based rules and helps convert them to App-ID rules.</li>
</ul>
<h4>User-ID</h4>
<ul>
<li>IP-to-user sources: AD security event logs (Windows agent or agentless), GlobalProtect, Authentication Portal, Terminal Server agent, syslog (for example from Cisco ISE or ClearPass), XML API, XFF.</li>
<li>Group mapping comes from LDAP or Cloud Identity Engine. Dynamic User Groups change policy by tag, with no commit needed.</li>
<li>ISE is the NAC and authentication authority. User-ID <i>consumes</i> identity for enforcement.</li>
</ul>
<h4>Content-ID</h4>
<ul>
<li>Profiles attach to <b>allow</b> rules: Antivirus, Anti-Spyware (with DNS Security), Vulnerability Protection, URL Filtering, File Blocking, WildFire, Data Filtering. Group them and make the group the default.</li>
<li>The Advanced subscriptions add inline ML for unknown C2, exploits and phishing. Single-pass architecture.</li>
</ul>
<h4>Policy gotchas</h4>
<ul>
<li>NAT policy is evaluated first. Security rules use the <b>pre-NAT IP</b> and the <b>post-NAT zone</b>.</li>
<li>Intrazone traffic is allowed and interzone denied by default. Override the defaults to get logging.</li>
<li>Decryption: SSL Forward Proxy (outbound), SSL Inbound Inspection (your servers), SSH Proxy. Exclude pinned apps and privacy categories.</li>
</ul>`,
  resources:[
    ["PAN-OS TechDocs","https://docs.paloaltonetworks.com/pan-os","Admin Guide sections: App-ID, User-ID, Security Profiles, Decryption, Policy Optimizer"],
    ["Best Practices","https://docs.paloaltonetworks.com/best-practices","Internet gateway and decryption best practices"],
    ["Beacon learning platform","https://beacon.paloaltonetworks.com","Search for free Firewall Essentials / PAN-OS courses"],
    ["Repo notes: 02-technology-mapping.md §5–6","https://github.com/coolmukky/project-te/blob/claude/zealous-cannon-6vv5py/sase-interview-prep/02-technology-mapping.md","Deep dive with interview Q&A"]
  ],
  quiz:[
    {q:"Which order matches how App-ID classifies traffic?", o:["Heuristics → signatures → port","IP/port → signatures → decryption (if policy) → protocol decoders → heuristics","Decryption → port → heuristics","URL category → signatures → port"], a:1, e:"Port gives the starting point, signatures identify, decryption exposes the inner app, decoders find tunneled apps, heuristics catch evasive ones."},
    {q:"What does service <code>application-default</code> enforce?", o:["Any port is allowed","The app is allowed only on its standard default ports","Only TCP/443","Only the ports listed in a service object"], a:1, e:"It stops apps running on non-standard ports, a classic evasion technique."},
    {q:"What is the main risk of application override?", o:["It increases CPU","It forces an app identity and skips L7 inspection, so Content-ID threat inspection isn't applied","It breaks NAT","It disables logging"], a:1, e:"Prefer a custom App-ID, which keeps inspection."},
    {q:"With destination NAT, a security rule matches on…", o:["Post-NAT IP and post-NAT zone","Pre-NAT IP and post-NAT zone","Pre-NAT IP and pre-NAT zone","Post-NAT IP and pre-NAT zone"], a:1, e:"This is the classic PAN-OS gotcha for SRX and Firepower engineers."},
    {q:"Security profiles should be attached to…", o:["Deny rules","Allow rules","NAT rules","Decryption rules only"], a:1, e:"Denied traffic is dropped. The risk lives in what you allow."},
    {q:"Which is NOT a User-ID mapping source?", o:["GlobalProtect","Syslog from Cisco ISE","Server monitoring of AD event logs","BGP communities"], a:3, e:"BGP carries routes, not identities."},
    {q:"Which tool converts legacy port-based rules into App-ID rules?", o:["Policy Optimizer","ADEM","Expedition only","Command Center"], a:0, e:"Policy Optimizer shows the apps seen on port-based rules and helps you write App-ID rules above them."}
  ],
  open:{prompt:"A customer migrating from SRX has the rule 'any → DC servers, tcp/443, permit'. Rewrite it into best-practice PAN-OS policy, and explain what App-ID can and can't see in TLS traffic before and after decryption.",
    keys:["Splits into App-ID based rules per app with user/group (User-ID) sources","Uses application-default instead of a port","Attaches a security profile group (threat, AV, vulnerability, WildFire, file blocking)","Uses Policy Optimizer or log data to discover the apps actually in use","Explains that before decryption App-ID sees handshake data such as SNI and certificates","Explains SSL Inbound Inspection for the company's own servers to enable full App-ID and Content-ID","Mentions decryption exclusions or TLS 1.3 / ECH limits"]}
},
{ id:"m4", day:1, title:"ZTNA 2.0, GlobalProtect and HIP", time:"45 min", prio:"P1", weight:2,
  objective:"Explain ZTNA 2.0 through configuration you could actually show, and describe GlobalProtect portal, gateway and HIP behavior.",
  learn:`
<h4>Palo Alto's five ZTNA 2.0 principles, mapped to configuration</h4>
<div class="tbl"><table>
<tr><th>Principle</th><th>What it looks like in Prisma Access</th></tr>
<tr><td>Least-privileged access</td><td>Rules matching App-ID (Layer 7) and user group, not IP and port grants</td></tr>
<tr><td>Continuous trust verification</td><td>HIP posture re-evaluated during the session. Access is removed when posture or behavior changes.</td></tr>
<tr><td>Continuous security inspection</td><td>Content-ID profiles on the allow rules for private app traffic, not just internet traffic</td></tr>
<tr><td>Protect all data</td><td>Enterprise DLP across private apps, SaaS and web</td></tr>
<tr><td>Secure all apps</td><td>Service connections and connectors for private apps, SaaS controls, Prisma Access Browser for unmanaged devices</td></tr>
</table></div>
<ul>
<li>The ZTNA 1.0 critique is "allow and ignore": the broker grants an IP:port tunnel, then stops looking.</li>
<li>Don't overclaim. Several competitors now re-check posture. The lasting difference is inline L7 inspection on all ports and protocols.</li>
</ul>
<h4>GlobalProtect</h4>
<ul>
<li>The <b>portal</b> authenticates the user and delivers configuration plus the gateway list. The <b>gateway</b> terminates the tunnel (IPsec with SSL fallback).</li>
<li>Modes: always-on (user-logon or pre-logon), on-demand. Split tunnel by domain, app or IP.</li>
<li><b>HIP</b> (Host Information Profile) reports OS and patch level, disk encryption and EDR status. HIP objects and profiles are match criteria in rules, and HIP notifications tell users what to fix.</li>
<li>The Prisma Access Agent is the newer agent managed in SCM ${V}. Check the current guidance for new deployments.</li>
</ul>`,
  resources:[
    ["ZTNA 2.0 overview (official)","https://www.paloaltonetworks.com/sase/ztna","Palo Alto's framing of the principles"],
    ["GlobalProtect TechDocs","https://docs.paloaltonetworks.com/globalprotect","Search: Host Information Profile, split tunnel"],
    ["Prisma Access TechDocs","https://docs.paloaltonetworks.com/prisma-access","Search: Prisma Access Agent"]
  ],
  quiz:[
    {q:"Which is NOT one of Palo Alto's ZTNA 2.0 principles?", o:["Least-privileged access","Continuous trust verification","Trust a session once the user has authenticated","Continuous security inspection"], a:2, e:"Trusting once is exactly the 'allow and ignore' behavior ZTNA 2.0 criticizes."},
    {q:"What is HIP in GlobalProtect?", o:["A routing protocol","Endpoint posture reported by the agent and used as a policy match criterion","A sandbox verdict","An IPsec cipher"], a:1, e:"HIP objects and profiles feed security rules."},
    {q:"GlobalProtect portal vs. gateway?", o:["Portal terminates tunnels, gateway gives config","Portal authenticates and delivers config plus the gateway list. Gateway terminates the tunnel.","They are the same","Gateway runs only on-prem"], a:1, e:"In Prisma Access both are hosted by Palo Alto."},
    {q:"A contractor must use an unmanaged laptop for two web apps. What fits best?", o:["Full-tunnel GlobalProtect with no HIP","Prisma Access Browser with data controls","Give them a site-to-site VPN","Open the apps to the internet"], a:1, e:"The enterprise browser extends policy and data controls to unmanaged devices."},
    {q:"Which configuration best shows 'continuous security inspection'?", o:["MFA at login","Threat and DLP profiles on the allow rules for private app traffic","A longer session timeout","Split tunneling"], a:1, e:"Inspection must continue on allowed traffic."}
  ],
  open:{prompt:"An interviewer asks: 'What's actually technically different about ZTNA 2.0, or is it marketing?' Answer with configuration you could show, and say what you'd tell SEs not to overclaim.",
    keys:["App-ID based rules instead of IP/port grants","HIP posture re-evaluated during the session, not only at connect","Content-ID and DLP applied to private app traffic","Example of what ZTNA 1.0 misses (a compromised authorized user exploiting the app)","Balanced view: competitors have closed some gaps; L7 inspection on all ports and protocols is the durable difference","Links it to enablement (teach SEs to show the config, not the slogan)"]}
},
{ id:"m5", day:1, title:"Traffic flows, DNS and routing", time:"1 h", prio:"P0", weight:3,
  objective:"Trace internet, SaaS, private app and branch flows end to end, and point to where DNS and the return path break.",
  learn:`
<div class="flow">MU → Internet    Laptop → GP tunnel → MU-SPN [decrypt? App-ID User-ID URL Threat DNS DLP] → location egress IP
MU → private app Laptop → GP → MU-SPN (user, App-ID, HIP, profiles) → backbone → SC → IPsec → DC edge → app
   return        app → DC routing MUST send the MU pool to the SC → SC → backbone → MU-SPN → laptop
MU → connector   Laptop → GP → MU-SPN (policy on app target) → connector tunnel → connector (NAT) → app
Branch → DC      LAN → ION path policy → IPsec → RN-SPN → backbone → SC → DC
   or            LAN → ION secure fabric → DC ION → DC NGFW inspects</div>
<h4>DNS</h4>
<ul>
<li>Configure <b>internal DNS domains</b> and internal DNS servers in Prisma Access. The SPN proxies those names to servers reached via the SC.</li>
<li>"Works by IP, fails by name" almost always means a split DNS or internal domain gap.</li>
</ul>
<h4>Routing</h4>
<ul>
<li>The SC runs BGP. Prisma Access advertises MU pools and RN subnets, and the DC advertises app prefixes.</li>
<li>Asymmetric return is the top failure: the DC sends the MU pool via an old VPN concentrator or the internet edge, and a stateful firewall drops it.</li>
<li>Two DCs: control preference with BGP attributes and the Prisma Access backbone routing settings ${V}.</li>
<li>SaaS source-IP allow-listing uses the published Prisma Access egress IPs, or dedicated egress / Traffic Steering ${V}.</li>
</ul>
<h4>Branch-to-DC inspection decision</h4>
<ul><li>Via Prisma Access (RN→SC): one policy and log plane, plus a cloud hop. Via the SD-WAN fabric to the DC NGFW: lower latency, two policy points. Decide per app class.</li></ul>`,
  resources:[
    ["Prisma Access TechDocs","https://docs.paloaltonetworks.com/prisma-access","Search: Routing for Service Connections, Internal DNS / DNS Proxy, Traffic Steering, Egress IP"],
    ["Repo notes: 03-prisma-sase-architecture.md §6","https://github.com/coolmukky/project-te/blob/claude/zealous-cannon-6vv5py/sase-interview-prep/03-prisma-sase-architecture.md","All six flows"]
  ],
  quiz:[
    {q:"Users reach an internal app by IP but not by name. Most likely cause?", o:["App-ID mismatch","Internal DNS domain or servers not configured in Prisma Access, or a split DNS problem","Expired license","MTU"], a:1, e:"Name-only failure points at DNS."},
    {q:"Traffic logs show 'allow' with application <code>incomplete</code>. What does this suggest?", o:["The app was blocked by a profile","The TCP handshake never completed, which points to routing or the return path","The user isn't in the group","URL filtering"], a:1, e:"incomplete = no complete handshake. Look at the path to the server and back."},
    {q:"The DC routes the mobile user pool to a legacy VPN concentrator. Result?", o:["Nothing changes","Asymmetric return; stateful devices drop sessions. Fix routing so the MU pool goes back via the SC.","Higher throughput","DNS fails"], a:1, e:"The return path must come back through the SC."},
    {q:"A SaaS app only accepts logins from known source IPs. What do you use?", o:["The MU IP pool","Prisma Access egress IPs (published via API) or dedicated egress","The infrastructure subnet","The connector IP"], a:1, e:"The SaaS sees the egress IP of the location, not internal pools."},
    {q:"Which is a fair statement about inspecting branch-to-DC traffic in Prisma Access vs. at the DC NGFW?", o:["Prisma Access is always lower latency","Via Prisma Access gives one policy and log plane at the cost of a cloud hop. The SD-WAN fabric to the DC NGFW is lower latency with two policy points.","There is no difference","DC NGFW can't inspect"], a:1, e:"Decide per app class and say why."}
  ],
  open:{prompt:"Trace a mobile user reaching jira.corp.local through a service connection, hop by hop, including DNS and the return path. Name three places it can fail and the evidence you'd check for each.",
    keys:["Agent/GlobalProtect tunnel to MU-SPN with an IP from the MU pool","DNS resolution of the internal domain via Prisma Access internal DNS to DC DNS servers","Policy lookup at the SPN (user, App-ID, HIP, profiles)","Backbone to the SC, IPsec and BGP route for the app prefix","Return path: DC must route the MU pool back to the SC","Names concrete evidence: traffic logs, SC tunnel/BGP status, DC firewall logs, client routing table"]}

{ id:"m6", day:1, title:"Troubleshooting: authenticated but no access", time:"1 h", prio:"P0", weight:3,
  objective:"Run a structured, evidence-led troubleshooting workflow for Scenario B and turn it into an enablement lab.",
  learn:`
<h4>Order of operations</h4>
<ul>
<li><b>Scope:</b> one user or many, one app or all, by FQDN and by IP, since when, what changed, and the exact error (DNS failure, timeout, reset, 403).</li>
<li><b>Client and tunnel:</b> which gateway or location, MU pool IP assigned, <b>split-tunnel exclusions</b>, HIP report submitted.</li>
<li><b>DNS:</b> resolves to the internal IP? Internal domain listed? Client using tunnel DNS?</li>
<li><b>Logs:</b> no log = traffic never reached the SPN. Deny = which rule (group sync, HIP profile, App-ID or <code>application-default</code> mismatch, wrong address object). Allow + <code>incomplete</code> = path problem. Also check threat, URL and decryption logs.</li>
<li><b>Routing:</b> SC tunnel up, BGP established, app prefix learned, MU pool routed back, DC firewall allowing the MU pool, no overlap. For connectors: group health, tunnels, app target status, connector reach to the app.</li>
<li><b>Application:</b> server ACL still pinned to the old VPN pool, server-initiated flows, MTU/MSS (small responses work, large ones stall).</li>
<li><b>Prevent:</b> runbook entry, pre-change check, and a lab exercise.</li>
</ul>
<h4>The enablement move</h4>
<ul><li>Build a fault-injection lab (split-tunnel exclusion, missing DNS domain, return route, HIP mismatch, App-ID mismatch). Score SEs on time to root cause and on the evidence they used.</li></ul>`,
  resources:[
    ["Prisma Access TechDocs","https://docs.paloaltonetworks.com/prisma-access","Search: troubleshooting, Monitor / Activity, Service Connection status"],
    ["Strata Cloud Manager TechDocs","https://docs.paloaltonetworks.com/strata-cloud-manager","Log Viewer and Activity Insights"],
    ["Repo notes: 04-scenarios.md, Scenario B","https://github.com/coolmukky/project-te/blob/claude/zealous-cannon-6vv5py/sase-interview-prep/04-scenarios.md","Full workflow and follow-ups"]
  ],
  quiz:[
    {q:"What should you do first?", o:["Reboot the SC","Scope the problem: who, which apps, FQDN vs. IP, since when, what changed","Open a TAC case","Disable decryption"], a:1, e:"Scoping takes two minutes and decides where to look."},
    {q:"There is no traffic log for the user's session at all. Where do you look?", o:["DC firewall","The client side: split-tunnel exclusions, endpoint routing, DNS sending traffic elsewhere","BGP","Content-ID"], a:1, e:"If the SPN never saw it, the traffic didn't enter the tunnel."},
    {q:"The log shows a deny on a rule that requires HIP profile 'Corp-Managed'. Likely cause?", o:["MTU","The device fails posture (for example EDR not running) or the HIP report wasn't submitted","Wrong DNS","BGP down"], a:1, e:"Authentication can succeed while posture fails."},
    {q:"Small pages load but large downloads stall after the session starts. Suspect?", o:["Group mapping","MTU/MSS over IPsec","URL category","HIP"], a:1, e:"IPsec overhead plus blocked fragmentation is the classic cause."},
    {q:"It works for everyone except users connecting in Singapore. Best next step?", o:["Rewrite all policy","Check the location: which gateway and compute region, SC reachability and routing from that region, and regional DNS","Reinstall the agent everywhere","Turn off App-ID"], a:1, e:"A location-scoped symptom points to a location-scoped cause."}
  ],
  open:{prompt:"A remote employee authenticates to Prisma Access successfully but can't reach a private application. Walk the interviewer through your full troubleshooting workflow, then say how you'd use this scenario in SE enablement.",
    keys:["Scopes first (who, which apps, FQDN vs. IP, what changed)","Checks client, tunnel and split-tunnel configuration","Checks DNS (internal domains)","Interprets logs: no log vs. deny vs. allow-incomplete, and names the deny causes (group, HIP, App-ID)","Checks SC or connector health, BGP and the return route for the MU pool","Checks application-side ACLs and MTU","Ends with prevention and a fault-injection lab assessed on time to root cause"]}
},
{ id:"m7", day:1, title:"Prisma SD-WAN and management plane", time:"1 h", prio:"P1", weight:2,
  objective:"Explain app-defined path selection on ION devices, tell Prisma SD-WAN apart from PAN-OS SD-WAN, and recommend SCM or Panorama.",
  learn:`
<h4>Prisma SD-WAN (CloudGenix heritage)</h4>
<ul>
<li>ION devices identify the application per session and measure <b>per-application</b> performance (latency, jitter, loss and app response) on every path ${V} for current first-packet wording.</li>
<li>Policies: path (active, backup, L3 failure path per app), performance thresholds, QoS, NAT, zone-based firewall.</li>
<li>Sites build an auto-created secure fabric and run BGP/OSPF toward the LAN and DC.</li>
<li><b>Native Prisma Access integration</b> auto-provisions IPsec from ION to remote networks. Remote Site ADEM runs from the ION.</li>
</ul>
<div class="tbl"><table>
<tr><th></th><th>Prisma SD-WAN</th><th>Catalyst SD-WAN</th><th>Juniper SSR</th></tr>
<tr><td>Model</td><td>App and session first, IPsec overlay</td><td>Overlay first (OMP, TLOCs)</td><td>Session-based, tunnel-free (secure vector routing)</td></tr>
<tr><td>Path health</td><td>Per-app measured performance</td><td>BFD probes per tunnel vs. SLA classes</td><td>Per-session, service-based policy</td></tr>
</table></div>
<ul><li><b>Prisma SD-WAN ≠ PAN-OS SD-WAN.</b> PAN-OS SD-WAN is a Panorama plugin on NGFWs, for customers who want one box at the branch with simpler SD-WAN needs.</li></ul>
<h4>Strata Cloud Manager vs. Panorama</h4>
<ul>
<li>SCM: folders (inheritance), snippets (reusable config), unified NGFW + Prisma Access + SD-WAN, Command Center, AIOps best-practice checks, Policy Analyzer, an AI assistant ${V}.</li>
<li>Panorama: device groups and templates, on-prem or virtual. It can still manage Prisma Access.</li>
<li>Greenfield deployments usually go to SCM. A large mature Panorama estate means coexistence plus a migration plan. Check feature parity ${V}.</li>
</ul>`,
  resources:[
    ["Prisma SD-WAN TechDocs","https://docs.paloaltonetworks.com/prisma-sd-wan","Search: Path Policy, Performance Policy, Prisma Access integration"],
    ["Strata Cloud Manager TechDocs","https://docs.paloaltonetworks.com/strata-cloud-manager","Search: Folders, Snippets, Command Center, AIOps"],
    ["Repo notes: 02-technology-mapping.md §10, §13","https://github.com/coolmukky/project-te/blob/claude/zealous-cannon-6vv5py/sase-interview-prep/02-technology-mapping.md","SD-WAN and SCM deep dives"]
  ],
  quiz:[
    {q:"How does Prisma SD-WAN path selection differ from probe-based SD-WAN?", o:["It uses only MPLS","It identifies the app per session and measures that app's performance on each path, rather than only tunnel probes against SLA classes","It doesn't support failover","It uses OMP"], a:1, e:"It can catch an app degrading while link probes look healthy."},
    {q:"Prisma SD-WAN vs. PAN-OS SD-WAN?", o:["Same product","Prisma SD-WAN runs on ION devices as the SASE edge. PAN-OS SD-WAN is a Panorama-managed plugin on NGFWs.","PAN-OS SD-WAN is only for AWS","Prisma SD-WAN needs Panorama"], a:1, e:"Interviewers like to check that you don't mix them up."},
    {q:"How does an ION connect to Prisma Access?", o:["Manual GRE only","Native integration auto-provisions IPsec tunnels to remote networks","Through GlobalProtect","It can't"], a:1, e:"Zero-touch tunnels are part of the single-vendor argument."},
    {q:"What are SCM snippets?", o:["Log excerpts","Reusable configuration blocks applied across folders","ADEM tests","Firmware images"], a:1, e:"Folders give inheritance. Snippets give reuse."},
    {q:"What distinguishes Juniper SSR?", o:["BFD per tunnel","Session-based, tunnel-free routing with first-packet metadata","It is a proxy","OMP control plane"], a:1, e:"Useful for your competitive comparisons."}
  ],
  open:{prompt:"Explain to a Catalyst SD-WAN engineer how Prisma SD-WAN chooses a path for an application, and when you'd recommend PAN-OS SD-WAN on an NGFW instead.",
    keys:["Contrasts BFD probes / SLA classes with per-app session measurement","Describes path policy with active, backup and failover paths plus performance thresholds","Gives an example where app-level measurement catches what probes miss","Mentions native Prisma Access integration","Gives a sensible case for PAN-OS SD-WAN (one box, existing NGFW branch, simpler needs, Panorama shop)","Notes a tradeoff (dependence on app identification accuracy)"]}
},
{ id:"m8", day:1, title:"CASB, DLP, ADEM and Prisma Access Browser", time:"45 min", prio:"P2", weight:1,
  objective:"Place SaaS Security, Enterprise DLP, ADEM and the enterprise browser correctly in a design.",
  learn:`
<ul>
<li><b>SaaS Security</b>: <i>Inline</i> (App-ID, SaaS risk catalog, activity control such as upload, download, post), <i>API</i> (out-of-band scan of sanctioned SaaS: data at rest, sharing, malware, including activity from unmanaged devices) and <i>SSPM</i> (configuration posture). AI Access Security covers GenAI apps ${V}.</li>
<li><b>Tenant restrictions</b>: header insertion blocks personal Microsoft 365 or Google tenants. It requires decryption of that traffic.</li>
<li><b>Enterprise DLP</b>: one cloud detection engine shared by NGFW, Prisma Access and SaaS Security. Data patterns, EDM (exact data matching), document fingerprinting, ML classifiers, OCR. Start in alert mode to tune false positives.</li>
<li><b>ADEM</b>: synthetic tests from the endpoint agent and from ION sites. It splits the path into device, Wi-Fi/LAN, ISP, Prisma Access and app segments, and produces experience scores. Licensed add-on. The closest Cisco equivalent is ThousandEyes (broader, partial overlap). Juniper Marvis is network-side (partial).</li>
<li><b>Prisma Access Browser</b> (from the Talon acquisition): enterprise browser for unmanaged and BYOD devices, with copy, paste, download, print and screenshot controls. It can't cover thick-client apps.</li>
</ul>`,
  resources:[
    ["SaaS Security TechDocs","https://docs.paloaltonetworks.com/saas-security","Inline vs. API vs. SSPM"],
    ["Enterprise DLP TechDocs","https://docs.paloaltonetworks.com/enterprise-dlp","Data patterns, EDM"],
    ["Autonomous DEM TechDocs","https://docs.paloaltonetworks.com/autonomous-dem","Synthetic tests, segments"]
  ],

{ id:"m10", day:2, title:"Design scenarios: SASE transformation and NGFW segmentation", time:"1 h 30", prio:"P0", weight:3,
  objective:"Present Scenario A (20 branches, 500 remote users, M365, DC apps) and Scenario C (three-tier app segmentation) and defend the tradeoffs.",
  learn:`
<h4>Scenario A outline</h4>
<ul>
<li><b>Discovery first:</b> app inventory (protocols, server-initiated flows, IP-allow-listed SaaS), IdP and MDM and EDR, WAN contracts, compliance and decryption limits, ops ownership, real-time app volume.</li>
<li><b>Target:</b> ION at branches with native tunnels to remote networks. GlobalProtect/agent with CIE + Entra ID SAML and HIP. Two SCs with eBGP and a correct return path. Connectors for cloud apps. App-ID rules, profile groups, decryption with documented exclusions, DLP and tenant restrictions for M365. SCM, Strata Logging Service to SIEM, ADEM.</li>
<li><b>Phases:</b> foundation (identity, SCs, logging, policy baseline) → remote user pilot with the VPN as rollback → 2-branch pilot with MPLS kept → waves → optimize.</li>
<li><b>Metrics:</b> % internet no longer backhauled, M365 experience scores, DC bandwidth drop, % rules App-ID based, % decrypted, ticket volume, time to onboard a branch.</li>
</ul>
<h4>Scenario C outline</h4>
<ul>
<li>Zones per tier (web, app, DB, mgmt, user zones, contractors) so tier-to-tier traffic is interzone and inspected. Dynamic Address Groups for workloads.</li>
<li>Rules by group and App-ID with <code>application-default</code>. Finance write vs. employee read. Contractors with HIP or the browser. Admin ssh/ms-rdp for IT-Admins with HIP and MFA (authentication policy). Explicit deny + log.</li>
<li>Strict vulnerability profile on server-facing rules, DNS Security, WildFire, file blocking on uploads. SSL Inbound Inspection on the web tier.</li>
<li>Migration with Policy Optimizer: App-ID rules above the port rules, watch hit counts, then disable the old rules.</li>
</ul>`,

{ id:"m11", day:2, title:"Enablement strategy and the 90-day launch", time:"1 h 30", prio:"P0", weight:3,
  objective:"Present a 90-day readiness strategy for 1,000 SEs with tiers, phases and exit criteria, validation and metrics, and answer the measurement, influence and AI questions.",
  learn:`
<h4>Scenario D skeleton</h4>
<ul>
<li><b>Principles:</b> readiness is a field outcome, not completion. Tier the audience. Build from engineering truth. Practice beats presentation.</li>
<li><b>Tiers:</b> Champions (~50, expert, beta access), Core SEs (~600, practitioner: position, design, demo, run a guided POV), Broad SEs and partners (foundational: qualify and explain).</li>
<li><b>Phases:</b> Define (−90 to −60: use cases, competency model, metric baseline, lab design reviewed by Engineering) → Build + Champions (−60 to −30: lab-as-code, modular path, demo script, POV guide) → Launch waves (−30 to GA: regional workshops, labs, AI role-play simulations, validation) → Reinforce (GA and after: office hours, partner path, feedback to PM).</li>
<li><b>Validation:</b> hands-on lab with an automated checker that reads configuration state via API, plus a scenario design defense scored on a rubric.</li>
<li><b>Metrics ladder:</b> reach → learning (lab pass rate) → behavior (demos or POVs run, POV technical win rate, escalations per opportunity) → results (pipeline with the capability, attach rate, time to first deal). Compare validated vs. not-yet-validated cohorts, and say it's correlation.</li>
<li><b>Risks:</b> product slips (modular content, known-limitations page), lab scale (load test with champions), SE time (micro-learning, manager sponsorship), AI accuracy (grounding and SME review).</li>
</ul>
<h4>AI in enablement, safely</h4>
<ul><li>Uses: customer role-play simulations, adaptive lab hints, assessment drafting, detecting stale content from release notes, a field Q&amp;A assistant. Guardrails: retrieval grounded on approved, versioned sources; citations required; SME review; an evaluation set per release; human escalation; monitor wrong-answer rates.</li></ul>
<h4>Influencing PM and Engineering</h4>
<ul><li>Frame the ask in their goals (adoption, launch quality, fewer escalations). Bring field evidence. Offer reciprocity: champions as structured beta testers and a feedback loop.</li></ul>`,

const MOCK = { id:"m13", day:2, title:"Mock interview", time:"1 h 30", prio:"P0", weight:3, kind:"mock" };
const ALL = [...MODULES, MOCK];
const INTERVIEW = new Date(2026, 10, 2, 9, 0, 0);

/* ---------------------------------------------------------------- state */
const KEY = "panw-sase-runbook-v1";
let S = { quiz:{}, open:{}, mock:{ turns:[], current:null, debrief:null }, updatedAt:0 };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
if (!S.mock) S.mock = { turns:[], current:null, debrief:null };

let dbRef = null, dbTimer = null, dbBusy = false, dbDirty = false;
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (dbRef) { clearTimeout(dbTimer); dbTimer = setTimeout(pushDb, 1500); }
  renderHeader(); renderNav();
}
async function pushDb() {
  if (!dbRef) return;
  if (dbBusy) { dbDirty = true; return; }
  dbBusy = true;
  try { await dbRef.set({ state: JSON.stringify(S), updatedAt: S.updatedAt }); setSync("Progress synced to your account"); }
  catch (e) { setSync("Saved in this browser (account sync unavailable)"); }
  dbBusy = false;
  if (dbDirty) { dbDirty = false; pushDb(); }
}
function setSync(t) { const el = document.getElementById("sync"); if (el) el.textContent = t; }
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    dbRef = db.collection("data/users/" + id).doc("progress");
    const snap = await dbRef.get();
    if (snap.exists) {
      const d = snap.data() || {};
      if (d.state && (d.updatedAt || 0) > (S.updatedAt || 0)) {
        S = Object.assign(S, JSON.parse(d.state));
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
        route();
      }
    } else if (S.updatedAt) { pushDb(); }
    setSync("Progress synced to your account");
  } catch (e) { /* stay on local storage */ }
})();

let samplePromise = null;
function getSample() {
  if (!samplePromise) samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
  return samplePromise;
}

/* ---------------------------------------------------------------- scoring */
function quizPct(m) { const r = S.quiz[m.id]; return r ? r.best : null; }
function openPct(m) { const r = S.open[m.id]; return r && typeof r.score === "number" ? r.score : null; }
function mockScore() {
  const t = S.mock.turns.filter(x => x.eval && x.eval.pct != null);
  if (!t.length) return null;
  return Math.round(t.reduce((s, x) => s + x.eval.pct, 0) / t.length);
}
function modScore(m) {
  if (m.kind === "mock") return mockScore();
  const q = quizPct(m), o = openPct(m);
  if (q == null && o == null) return null;
  return Math.round((q || 0) * 0.6 + (o || 0) * 0.4);
}
function complete(m) {
  if (m.kind === "mock") return S.mock.turns.filter(x => x.eval).length >= 5;
  return quizPct(m) != null && openPct(m) != null;
}
function status(m) {
  const s = modScore(m);
  if (s == null) return { cls:"none", label:"Not started", log:"no log" };
  if (!complete(m)) return { cls:"prog", label:"In progress", log:"session open" };
  if (s >= 80) return { cls:"ready", label:"Ready", log:"allow" };
  if (s >= 60) return { cls:"dev", label:"Developing", log:"incomplete" };
  return { cls:"need", label:"Needs work", log:"deny" };
}
function readiness() {
  let w = 0, t = 0;
  ALL.forEach(m => { w += m.weight; t += m.weight * (modScore(m) || 0); });
  return Math.round(t / w);
}
function coverage() { return ALL.filter(complete).length; }
function nextStep() {
  const firstOpen = ALL.find(m => !complete(m));
  if (firstOpen) return firstOpen;
  const weak = ALL.filter(m => modScore(m) < 80).sort((a, b) => modScore(a) - modScore(b))[0];
  return weak || null;
}

/* ---------------------------------------------------------------- helpers */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const $ = id => document.getElementById(id);
const CATS = [["accuracy","Technical accuracy"],["depth","Architecture depth"],["problem_solving","Problem-solving"],["communication","Communication"],["strategy","Strategic judgment"],["relevance","Role relevance"]];
function catBars(scores) {
  return CATS.map(([k, label]) => {
    const v = Math.max(0, Math.min(5, Number(scores && scores[k]) || 0));
    return `<div class="cat"><span>${label}</span><div class="bar"><i style="width:${v * 20}%"></i></div><b class="mono tnum">${v}/5</b></div>`;
  }).join("");
}
function sampleErr(e) {
  const c = e && e.code;
  if (c === "not_granted") return "Claude grading isn't allowed for this page. Use the self-check below instead.";
  if (c === "rate_limited") return "Too many grading requests right now. Wait a minute, then try again.";
  if (c === "invalid_json") return "The grader's reply couldn't be read. Try again.";
  return "Grading didn't complete" + (e && e.message ? " (" + esc(e.message) + ")" : "") + ". Try again, or use the self-check below.";
}

/* ---------------------------------------------------------------- header + nav */
function renderHeader() {
  const r = readiness(), c = coverage();
  $("hdr-ready").textContent = r + " / 100";
  $("hdr-ready-bar").style.width = r + "%";
  $("hdr-cov").textContent = c + " of " + ALL.length;
  $("hdr-cov-bar").style.width = (c / ALL.length * 100) + "%";
  const ms = INTERVIEW - Date.now();
  $("hdr-count").textContent = ms > 0 ? Math.floor(ms / 3600000) + " h to Mon 9:00" : "Interview day";
  $("rail-sum").textContent = c + "/" + ALL.length + " complete";
}
function renderNav() {
  const cur = (location.hash || "#overview").slice(1);
  const row = (id, n, title, sub, cls) =>
    `<a class="step" href="#${id}" ${cur === id ? 'aria-current="page"' : ""}><span class="n">${n}</span><span class="t">${esc(title)}<small>${esc(sub)}</small></span><span class="dot ${cls}" title="${cls}"></span></a>`;
  const grp = (label, items) => `<div class="daygrp"><span class="label">${label}</span>${items.join("")}</div>`;
  const items = d => ALL.filter(m => m.day === d).map(m => {
    const st = status(m), i = ALL.indexOf(m) + 1, sc = modScore(m);
    return row(m.id, String(i).padStart(2, "0"), m.title, m.prio + " · " + m.time + (sc != null ? " · " + sc : ""), st.cls);
  });
  $("nav").innerHTML =
    grp("Start", [row("overview", "··", "Readiness overview", "Score, plan, next step", "")]) +
    grp("Day 1 · Sat Oct 31 · Technical", items(1)) +
    grp("Day 2 · Sun Nov 1 · Design, strategy, mock", items(2)) +
    grp("Mon Nov 2 · Morning", [row("monday", "✓", "Revision sheet", "15 min, nothing new", "")]);
}

/* ---------------------------------------------------------------- overview */
function viewOverview() {

function order(seed, n) {
  let h = 2166136261;
  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0;
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 13), 1103515245) + 12345 >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

      const vals = CATS.map(([k]) => Math.max(1, Math.min(5, Number(r.scores[k]) || 1)));
      t.eval = { scores:r.scores, missing:r.missing || [], improved:r.improved || "", pct:Math.round(vals.reduce((s, v) => s + v, 0) / vals.length * 20) };
      if (r.next && r.next.question) S.mock.turns.push({ q:String(r.next.question), cat:String(r.next.category || "question"), followup:r.next.type === "followup" });
      save(); route();
    } catch (e) { t.a = null; S.mock.draft = a; msg.innerHTML = sampleErr(e); sd.disabled = false; }
  });
  const db = $("mock-debrief");
  if (db) db.addEventListener("click", async () => {
    const sample = await getSample(), msg = $("mock-msg");
    if (!sample) { msg.textContent = "Claude isn't available in this view."; return; }
    db.disabled = true; msg.textContent = "Writing your debrief…";
    const prompt = `${MOCK_SYS()}

Full transcript with per-answer scores:
${S.mock.turns.filter(t => t.eval).map((t, i) => `Q${i + 1} [${t.cat}]: ${t.q}\nA: ${t.a}\nScores: ${JSON.stringify(t.eval.scores)}`).join("\n\n")}

The interview is Monday Nov 2, 2026. Write a hiring-panel style debrief. Reply with only JSON:
{"overall":0,"verdict":"two sentences: would this candidate advance, and why","strengths":["..."],"fixes":["the 3 most important, specific fixes"],"next_steps":["concrete study or practice actions for the remaining time"]}
overall is 0-100.`;
    try {
      const r = await sample.json(prompt, { modelTier:"default", cache:false });
      if (!r || r.overall == null) throw { code:"invalid_json" };
      r.overall = Math.max(0, Math.min(100, Math.round(Number(r.overall) || 0)));
      S.mock.debrief = r; save(); route();
    } catch (e) { msg.innerHTML = sampleErr(e); db.disabled = false; }
  });
}

/* ---------------------------------------------------------------- router */
function route() {
  const id = (location.hash || "#overview").slice(1);
  const m = MODULES.find(x => x.id === id);
  const v = $("view");
  if (m) { v.innerHTML = viewModule(m); bindModule(m); }
  else if (id === "m13") { v.innerHTML = viewMock(); bindMock(); }
  else if (id === "monday") { v.innerHTML = viewMonday(); }
  else { v.innerHTML = viewOverview(); }
  renderHeader(); renderNav();
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-go]");
  if (!b) return;
  const target = "#" + b.dataset.go;
  if (location.hash === target) route(); else location.hash = target;
  window.scrollTo(0, 0);
});
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); if (window.matchMedia("(max-width:860px)").matches) $("rail").open = false; });
$("rail").open = !window.matchMedia("(max-width:860px)").matches || !location.hash;
setInterval(renderHeader, 60000);
route();
})();
</script>
